}
@media print{
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  body{background:#fff; font-size:10.5pt}
  .bar,.side,.sresize,.tabs,.navbtn,.ectl,.etail,.eset,.ctl,.toast,.emptyc{display:none !important}
  .view[hidden]{display:none !important}
  .layout{display:block}
  .main{padding:0}
  .top{border:0; padding:0 0 10px; break-after:avoid}
  .ponly{display:block}
  h1.ptitle{font-size:16pt; margin:2px 0 12px; break-after:avoid}
  .card,.ccard{border:0; border-radius:0; margin:0 0 16px; box-shadow:none; break-inside:avoid; overflow:visible}
  .ccard.long{break-inside:auto}
  .card.flash,.ccard.flash{outline:none}
  .ccard>header,.card>header{border:0; padding:0 0 5px; break-after:avoid}
  .ccard.hd,.ccard.cm{border:0; margin:0 0 8px}
  .ccard.hd{break-after:avoid; margin-top:8px}
  .ccard.hd>header,.ccard.cm>header,.ccard .hin,.ccard .cin{display:none}
  .kgrid{grid-template-columns:repeat(3, 1fr); gap:10px}
  .ccard.xk{border:1px solid #D5DAE2 !important; border-radius:6px !important; break-inside:avoid; padding:4px 12px 10px}
  .ccard.xk>header,.ccard.xs>header,.ccard.xp>header,.ccard.xg>header{display:none}
  .ccard.xg.gcard{border:1px solid #D5DAE2 !important; border-radius:6px !important; break-inside:avoid}
  .gtrack{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .rmodal-ov{display:none !important}
  .ccard.blank{display:none}
  .ccard h2.ptext{font-size:14pt; margin:0; padding-bottom:4px; border-bottom:2px solid var(--accent); color:var(--ink)}
  .ccard div.ptext{white-space:pre-wrap; line-height:1.5; color:var(--ink)}
  .scroll{overflow:visible}
  table.ct{min-width:0 !important; font-size:8.5pt; --lblw:24%}
  table.ct th,table.ct td{padding:3px 3px; overflow-wrap:break-word; hyphens:auto}
  table.ct th{font-size:7.5pt; line-height:1.2}
  table.ct th.lbl,table.ct td.lbl{min-width:0}
  .ct .stickycol{position:static !important; box-shadow:none !important}
  .chartbox{padding:4px 0 0}
  .chartbox svg{max-width:180mm}
  .notes{padding:4px 0 0}
}

/* ---- the block order dialog ---- */
.ordhint{margin:0 0 10px; font-size:12.5px; color:var(--muted)}
.ordlist{border:1px solid var(--rule); border-radius:6px; overflow:hidden}
.ordrow{display:flex; align-items:center; gap:6px; padding:5px 8px; border-bottom:1px solid var(--rule-soft, var(--rule)); background:var(--surface); font-size:13px; position:relative}
.ordrow:last-child{border-bottom:0}
.ordrow.okh{background:var(--surface-2, #f4f6f9)}
.ordrow.okh .ordt{font-weight:650}
.ordrow.dragging{opacity:.45}
.ordrow.dropb{box-shadow:inset 0 3px 0 var(--accent)}
.ordrow.dropa{box-shadow:inset 0 -3px 0 var(--accent)}
.ordrow.flash{background:color-mix(in srgb, var(--accent) 14%, var(--surface))}
.ordgrip{cursor:grab; color:var(--muted); padding:2px 4px; touch-action:none; user-select:none}
.ordgrip:active{cursor:grabbing}
.ordn{color:var(--muted); min-width:2.2em; text-align:right; font-variant-numeric:tabular-nums}
.ordk{flex:0 0 auto; font-size:11px; padding:1px 6px; border-radius:9px; background:var(--surface-2, #eef1f5); color:var(--muted); border:1px solid var(--rule)}
.ordt{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ordrow .ib:disabled{opacity:.3}

/* ---- figure cards: a caption and one figure (with a significance mark) ---- */
.ccard.xk{min-height:128px}
.ccard.xk .kl{margin:6px 0 10px}
.ccard.xk .kv{margin-top:auto; display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 10px}
.ccard.xk .kv.low .kvn{color:var(--muted)}
.ccard.xk .ksig{font-size:12.5px; font-weight:650; letter-spacing:0; white-space:nowrap}
.ccard.xk .ksig.up{color:#2E7D32}
.ccard.xk .ksig.dn{color:#C62828}
/* the card editor */
.rmodal:has(.kedit){width:min(860px, 100%)}
.kedit{display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:18px; align-items:start}
@media (max-width:720px){ .kedit{grid-template-columns:minmax(0,1fr)} }
.kside{position:sticky; top:0}
.kpvl{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 6px}
.ccard.kpv{margin:0; border:1px solid var(--rule); border-radius:8px; padding:4px 16px 14px; background:var(--surface)}
.ccard.kpv.empty{border-style:dashed; justify-content:center}
.kpvhint{font-size:12.5px; color:var(--muted); text-align:center}
.kchips{display:flex; flex-wrap:wrap; gap:6px}
.kchip{font:inherit; font-size:12.5px; padding:5px 11px; border-radius:16px; border:1px solid var(--rule); background:var(--surface); color:var(--ink); cursor:pointer; text-align:left}
.kchip:hover{border-color:var(--accent)}
.kchip.net{font-weight:650}
.kchip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
/* the progress editor */
.gedit .gpart{display:block}
.gfill{display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; margin:0 0 8px; font-size:12.5px; color:var(--ink-2)}
.rf .gfill input{width:110px; padding:5px 7px; border:1px solid var(--rule); border-radius:5px; font:inherit; font-size:13px}
.gopts{display:flex; flex-direction:column; gap:6px; margin:0 0 12px}
.gtotrow{display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px}
.gtotrow input[type=number]{width:110px; padding:5px 7px; border:1px solid var(--rule); border-radius:5px; font:inherit; font-size:13px}
.gtotrow input[type=number]:disabled{opacity:.45}
.gedit{grid-template-columns:minmax(0,1fr) 300px}
.kpv .gtop{flex-direction:column; align-items:flex-start; gap:1px}
.kpv .gtop .glab{white-space:normal; overflow:visible}
.ccard.xg.kpv{padding:4px 16px 14px}
.ccard.xg.kpv .xtitle{font-size:15px; margin:8px 0 10px}
@media (max-width:720px){ .kedit.gedit{grid-template-columns:minmax(0,1fr)} }
/* the quotes editor */
.qedit{grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:720px){ .kedit.qedit{grid-template-columns:minmax(0,1fr)} }
.qtools{display:flex; align-items:center; gap:10px; margin:0 0 6px}
.qtools .osearch{flex:1; font:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--rule); border-radius:5px; background:var(--surface); color:var(--ink)}
.qcount{font-size:12px; color:var(--muted); white-space:nowrap}
.qlist{border:1px solid var(--rule); border-radius:6px; max-height:300px; overflow-y:auto}
.qitem{display:flex; width:100%; gap:10px; align-items:flex-start; text-align:left; font:inherit; font-size:13px; padding:6px 10px; border:0; border-bottom:1px solid var(--rule-soft); background:var(--surface); color:var(--ink); cursor:pointer}
.qitem:last-child{border-bottom:0}
.qitem:hover{background:var(--surface-2)}
.qitem[aria-pressed="true"]{background:color-mix(in srgb, var(--accent) 12%, var(--surface)); box-shadow:inset 3px 0 0 var(--accent)}
.qitem .qt{flex:1}
.qitem .qn{color:var(--muted); font-variant-numeric:tabular-nums}
.ccard.xx.kpv .xquotes{grid-template-columns:1fr}
.ccard.xx.kpv .xquote{font-size:13.5px}
.ccard.xo .oblk,.ccard.xx .xquotes{margin-top:6px}
#vCustom.locked .ccard.xo>header,#vCustom.locked .ccard.xx>header{display:none}
.ccard.xo>header,.ccard.xx>header{border-bottom:0; padding:6px 10px 0; min-height:6px}
.ccard.xo{padding:0 0 0}
.ccard.xo .xtitle{padding:0 14px}
.ccard.xo .oblk{margin:6px 0 0; border-width:1px 0 0; border-radius:0}
.ccard.xx{padding:0 14px 14px}
@media print{ .ccard.xo>header,.ccard.xx>header{display:none} }

/* ---------- data grid (shared by the tool and the interactive report) ---------- */
.dgwrap{position:relative; display:flex; flex-direction:column; min-height:0; flex:1 1 auto}
.dg{position:relative; flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; background:var(--surface);
  border:1px solid var(--rule); border-radius:5px; font-size:12.5px; font-variant-numeric:tabular-nums; outline:none}
.dg:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.dg-layer{position:relative}
.dg-edlayer{position:absolute; top:0; left:0; z-index:20}
.dg-head{position:sticky; top:0; z-index:6; display:flex; height:58px; background:var(--surface-2)}
.dg-hfz{position:sticky; left:0; z-index:10; flex:0 0 auto; height:58px; background:var(--surface-2)}
.dg-hs{position:relative; z-index:1; flex:0 0 auto; height:58px}
.dg-body{display:flex; position:relative}
.dg-fcol{position:sticky; left:0; z-index:5; flex:0 0 auto; height:100%; background:var(--surface-2)}
.dg-cells{position:relative; z-index:1; flex:0 0 auto; height:100%}
.dg .c,.dg .h{position:absolute; box-sizing:border-box; border-right:1px solid var(--rule-soft); border-bottom:1px solid var(--rule-soft)}
.dg .c{height:26px; line-height:25px; padding:0 7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink); background:var(--surface); cursor:cell}
.dg .c.num{text-align:right}
.dg .c.selrow{background:color-mix(in srgb, var(--accent) 6%, var(--surface))}
.dg .c.sel{outline:2px solid var(--accent); outline-offset:-2px; z-index:1; background:var(--surface)}
.dg .c.der{color:var(--ink-2); background:color-mix(in srgb, var(--surface-2) 55%, var(--surface))}
.dg .c.umis{color:var(--muted); font-style:italic}
.dg .c.del{color:var(--muted); text-decoration:line-through; background:color-mix(in srgb, #B42318 5%, var(--surface))}
.dg .c.fz{z-index:3; background:var(--surface-2)}
.dg .c.fz.selrow{background:color-mix(in srgb, var(--accent) 12%, var(--surface-2))}
.dg .c.idc{font-weight:600; border-right:2px solid var(--muted); cursor:cell}
.dg .c.idc.sel{z-index:4}
.dg .c.rn{display:flex; align-items:center; justify-content:space-between; gap:2px; padding:0 3px 0 6px; color:var(--muted); font-size:11.5px; cursor:default}
.dg .c.rn.del{text-decoration:none}
.dg .c.rn .rnn{overflow:hidden; text-overflow:ellipsis}
.dg .rdel{border:0; background:none; color:var(--muted); font-size:13px; line-height:1; padding:2px 4px; border-radius:3px; opacity:0; cursor:pointer}
.dg .c.rn:hover .rdel,.dg .c.rn.del .rdel,.dg .c.rn.selrow .rdel{opacity:1}
.dg .rdel:hover{color:#B42318; background:var(--surface)}
.dg .c.rn.del .rdel{color:var(--accent)}
.dg .h{height:58px; z-index:5; background:var(--surface-2); padding:5px 20px 4px 7px; border-bottom:1.5px solid var(--rule); cursor:default}
.dg .h.fz{z-index:7}
.dg .h.idh{border-right:2px solid var(--muted)}
.dg .h.corner{z-index:8; display:flex; align-items:flex-end; color:var(--muted)}
.dg .h.selh{box-shadow:inset 0 -2px 0 var(--accent)}
.dg .h.der .hn{color:var(--ink-2)}
.dg .hn{font-weight:650; font-size:12px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dg .hn .ro{font-size:10px; opacity:.6}
.dg .hl{font-size:11px; line-height:1.25; color:var(--muted); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; margin-top:1px}
.dg .hf{position:absolute; right:3px; top:4px; width:17px; height:17px; border:1px solid var(--rule); border-radius:3px; background:var(--surface);
  color:var(--muted); font-size:10px; line-height:14px; padding:0; cursor:pointer}
.dg .hf:hover{border-color:var(--accent); color:var(--accent)}
.dg .hf.on{background:var(--accent); border-color:var(--accent); color:#fff}
.dg .rz{position:absolute; right:-3px; top:0; width:7px; height:100%; cursor:col-resize; z-index:2}
.dg .rz:hover{background:color-mix(in srgb, var(--accent) 35%, transparent)}
.dg-empty{position:absolute; padding:18px 16px; color:var(--muted); font-size:13px}
/* editor */
.dg-ed{position:absolute; z-index:20; min-width:120px}
.dg-in{display:block; width:100%; height:26px; box-sizing:border-box; border:2px solid var(--accent); border-radius:0; padding:0 6px;
  font:inherit; font-size:12.5px; background:var(--surface); color:var(--ink); outline:none}
.dg-list{max-height:220px; overflow-y:auto; background:var(--surface); border:1px solid var(--rule); border-top:0; box-shadow:0 10px 24px rgba(20,26,34,.18)}
.dg-opt{padding:4px 8px; font-size:12.5px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dg-opt b{display:inline-block; min-width:26px; color:var(--muted); font-weight:600}
.dg-opt:hover,.dg-opt.on{background:var(--accent-soft)}
.dg-opt.none{color:var(--muted); font-style:italic; cursor:default; white-space:normal}
.dg-msg{background:#B42318; color:#fff; font-size:11.5px; padding:3px 7px}
/* filter popup */
.dg-pop{position:absolute; z-index:40; width:280px; background:var(--surface); border:1px solid var(--rule); border-radius:6px;
  box-shadow:0 14px 34px rgba(20,26,34,.22); padding:8px; font-size:12.5px; color:var(--ink)}
.dg-ph{display:flex; flex-direction:column; gap:1px; padding:0 2px 6px; border-bottom:1px solid var(--rule-soft); margin-bottom:6px}
.dg-ph span{color:var(--muted); font-size:11.5px; line-height:1.25; max-height:2.6em; overflow:hidden}
.dg-prow{display:flex; gap:6px; margin-bottom:6px}
.dg-prow button,.dg-pbtn button{flex:1; border:1px solid var(--rule); background:var(--surface); border-radius:4px; padding:3px 6px; font:inherit; font-size:12px; color:var(--ink); cursor:pointer}
.dg-prow button:hover,.dg-pbtn button:hover{border-color:var(--accent); color:var(--accent)}
.dg-ps{width:100%; box-sizing:border-box; padding:4px 7px; border:1px solid var(--rule); border-radius:4px; margin-bottom:6px; font:inherit; font-size:12.5px; background:var(--surface); color:var(--ink)}
.dg-pall{display:flex; gap:6px; align-items:center; padding:3px 2px; font-weight:600; border-bottom:1px solid var(--rule-soft)}
.dg-plist{max-height:260px; overflow-y:auto; overscroll-behavior:contain; margin:2px 0 6px}
.dg-pi{display:flex; gap:6px; align-items:flex-start; padding:3px 2px; border-radius:3px; cursor:pointer}
.dg-pi:hover{background:var(--surface-2)}
.dg-pi[hidden]{display:none}
.dg-pi span{flex:1; min-width:0; line-height:1.3; overflow-wrap:anywhere}
.dg-pi i{color:var(--muted); font-style:normal; font-size:11px}
.dg-pi small{color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
.dg-pi input,.dg-pall input{margin:2px 0 0; accent-color:var(--accent)}
.dg-more{color:var(--muted); font-size:11px; padding:4px 2px}
.dg-pbtn{display:flex; gap:6px; align-items:center; border-top:1px solid var(--rule-soft); padding-top:7px}
.dg-pbtn span{flex:1}
.dg-pbtn .dg-clear{flex:0 0 auto}
.dg-pbtn .dg-ok{background:var(--accent); border-color:var(--accent); color:#fff; flex:0 0 56px}
.dg-pbtn .dg-ok:hover{color:#fff; filter:brightness(1.08)}
.dg-pbtn .dg-cancel{flex:0 0 auto}

/* ---- open (text) answers: a collapsible list ---- */
.oblk{border:1px solid var(--rule); border-radius:6px; background:var(--surface); margin:10px 0 4px; overflow:hidden}
.oblk.linked{margin:0; border-width:1px 0 0; border-radius:0}
.ohd{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:8px 12px; background:var(--surface-2); border-bottom:1px solid var(--rule-soft)}
.ott{font-size:12px; font-weight:650; text-transform:uppercase; letter-spacing:.04em; color:var(--accent)}
.obase{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.ospacer{flex:1}
.otools{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.otools .osearch,.otools .ofilt{font:inherit; font-size:12.5px; padding:4px 8px; border:1px solid var(--rule); border-radius:5px; background:var(--surface); color:var(--ink); min-width:0}
.otools .osearch{width:170px}
.otools .ofilt{max-width:200px}
.oseg button{font-size:12px}
.obody{padding:0}
.olist{width:100%; border-collapse:collapse; font-size:13px}
.olist th{font-size:11px; font-weight:600; color:var(--muted); text-align:left; padding:6px 12px; border-bottom:1px solid var(--rule-soft); background:var(--surface)}
.olist td{padding:5px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:top; color:var(--ink); line-height:1.4}
.olist tr:last-child td{border-bottom:0}
.olist .on{width:90px; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.olist th.on{text-align:right}
.olist .oi{width:40px; color:var(--muted); font-variant-numeric:tabular-nums}
.olist .oid{width:90px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.olist .ot{word-break:break-word}
.omore{display:flex; align-items:center; gap:10px; padding:8px 12px; border-top:1px solid var(--rule-soft)}
.omini{font-size:12px; color:var(--muted)}
.onone{padding:10px 12px; font-size:12.5px; color:var(--muted)}
@media print{
  .otools,.omore button{display:none !important}
  .oblk{break-inside:auto}
}
/* quotes chosen by the report's author */
.xquotes{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; margin:4px 0 2px}
.xquote{margin:0; padding:12px 16px 12px 18px; border-left:4px solid var(--accent); background:var(--surface-2); border-radius:0 6px 6px 0;
  font-size:15px; line-height:1.5; font-style:italic; color:var(--ink)}
.xquote::before{content:'«'; color:var(--accent); font-weight:700; margin-right:2px; font-style:normal}
.xquote::after{content:'»'; color:var(--accent); font-weight:700; margin-left:2px; font-style:normal}
.xqsrc{font-size:12px; color:var(--muted); margin:8px 0 0}

<script type="text/plain" id="rep-zip">/* Minimal ZIP writer (stored, no compression) with the slice of the JSZip API the exporters use:
   new JSZip(); zip.file(path, string); zip.folder(name) -> {file, folder}; zip.generateAsync({mimeType}) -> Promise<Blob> */
(function(root){
  'use strict';
  var CRC = (function(){
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++){
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8){
    var c = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  var enc = new TextEncoder();
  function Folder(zip, prefix){ this.z = zip; this.p = prefix; }
  Folder.prototype.file = function(name, data){ this.z.file(this.p + name, data); return this; };
  Folder.prototype.folder = function(name){ return new Folder(this.z, this.p + name.replace(/\/?$/, '/')); };

  function MiniZip(){ this.entries = []; }
  MiniZip.prototype.file = function(path, data){
    var bytes = typeof data === 'string' ? enc.encode(data) : new Uint8Array(data);
    this.entries.push({ name: enc.encode(path), data: bytes, crc: crc32(bytes) });
    return this;
  };
  MiniZip.prototype.folder = function(name){ return new Folder(this, name.replace(/\/?$/, '/')); };
  /* DEFLATE through the browser's CompressionStream when asked for and available; otherwise stored */
  function deflateRaw(u8){
    var cs = new CompressionStream('deflate-raw');
    var out = new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer();
    return out.then(function(b){ return new Uint8Array(b); });
  }
  MiniZip.prototype.generateAsync = function(opts){
    var self = this;
    var want = opts && opts.compression === 'DEFLATE' && typeof CompressionStream !== 'undefined' && typeof Response !== 'undefined';
    if (!want) return Promise.resolve(this._build(opts));
    return Promise.all(this.entries.map(function(e){
      if (e.data.length < 256) return Promise.resolve(null);
      return deflateRaw(e.data).catch(function(){ return null; });
    })).then(function(packed){
      self.entries.forEach(function(e, i){ if (packed[i] && packed[i].length < e.data.length){ e.packed = packed[i]; } });
      return self._build(opts);
    });
  };
  MiniZip.prototype._build = function(opts){
    var parts = [], central = [], offset = 0;
    var d = new Date();
    var dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    var dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    this.entries.forEach(function(e){
      var body = e.packed || e.data, method = e.packed ? 8 : 0;
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
      h.setUint16(8, method, true); h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true);
      h.setUint32(14, e.crc, true); h.setUint32(18, body.length, true); h.setUint32(22, e.data.length, true);
      h.setUint16(26, e.name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), e.name, body);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true);
      c.setUint16(8, 0x0800, true); c.setUint16(10, method, true); c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true);
      c.setUint32(16, e.crc, true); c.setUint32(20, body.length, true); c.setUint32(24, e.data.length, true);
      c.setUint16(28, e.name.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true);
      c.setUint16(34, 0, true); c.setUint16(36, 0, true); c.setUint32(38, 0, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), e.name);
      offset += 30 + e.name.length + body.length;
    });
    var cdSize = central.reduce(function(s, p){ return s + p.length; }, 0);
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, this.entries.length, true);
    end.setUint16(10, this.entries.length, true); end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    var blob = new Blob(parts.concat(central, [new Uint8Array(end.buffer)]),
                        { type: (opts && opts.mimeType) || 'application/zip' });
    return blob;
  };
  root.JSZip = MiniZip;
})(typeof self !== 'undefined' ? self : this);
</script>

/* ---------------- recomputation ---------------- */
/* cfg = which banner groups, significance letters, arrows and counts a table shows; the main tab uses the toolbar */
function cfgMain(){ return { groups:visibleGroups(), sig:S.sig, arrows:S.arrows, n:S.n }; }
function opts(cfg){
  cfg = cfg || cfgMain();
  return Object.assign({}, D.opts, {
    measures: cfg.n ? ['pct', 'n'] : ['pct'],
    sigEnabled: cfg.sig, sigVsTotal: cfg.arrows, suppressLowBase: false, emphasizeTotal: true,
    sep: sep(), L: LBL, totalLabel: tx.total

}
function visibleGroups(){ var out = []; S.on.forEach(function(v, i){ if (v) out.push(i); }); return out; }

function makeTable(t, o, cfg){
  cfg = cfg || cfgMain();
  var idx = [0], columns = [{ key:'total', label:D.L.total || tx.total, isTotal:true, letter:'' }], groups = [], k = 0;
  cfg.groups.forEach(function(gi){
    var b = D.banner[gi], cs = idx.length;
    b.cats.forEach(function(c, ci){
      idx.push(b.start + ci);
      columns.push({ label:c, letter:T.letters(k++), groupId:groups.length, isTotal:false });
    });
    groups.push({ label:b.label, colStart:cs, colEnd:idx.length - 1 });
  });
  var pick = function(a){ return idx.map(function(i){ return a[i]; }); };
  var bn = pick(t.bn), bw = pick(t.bw), be = pick(t.be), nC = idx.length;
  var rows = t.rows.map(function(r){
    var n = pick(r.n), w = pick(r.w), totW = w[0];
    return { label:r.l, missing:!!r.m, net:!!r.nt, cells:n.map(function(nn, c){
      var wn = w[c], pct;
      if (o.pctBase === 'row') pct = totW > 0 ? 100 * wn / totW : null;
      else if (o.pctBase === 'total') pct = bw[0] > 0 ? 100 * wn / bw[0] : null;
      else pct = bw[c] > 0 ? 100 * wn / bw[c] : null;
      return { n:nn, wn:wn, pct:pct, sig:[], vsTotal:'' };
    }) };
  });
  var eff = function(c){ return (!D.weighted || o.sigBase === 'unweighted') ? bn[c] : be[c]; };
  var alpha = 1 - (o.sigLevel || 0.95);
  var twoZ = function(z){ return 2 * (1 - T.normCdf(Math.abs(z))); };
  var skip = function(r){ return r.missing && !o.includeMissing; };

  if (cfg.sig && groups.length){
    groups.forEach(function(g){
      rows.forEach(function(r){
        if (skip(r)) return;
        for (var a = g.colStart; a <= g.colEnd; a++) for (var b = g.colStart; b <= g.colEnd; b++){
          if (a === b) continue;
          var na = eff(a), nb = eff(b);
          if (!(na >= 2 && nb >= 2)) continue;
          var pa = r.cells[a].pct, pb = r.cells[b].pct;
          if (pa === null || pb === null) continue;
          pa /= 100; pb /= 100;
          var pooled = (pa * na + pb * nb) / (na + nb);
          var se = Math.sqrt(pooled * (1 - pooled) * (1 / na + 1 / nb));
          if (!(se > 0)) continue;
          if (twoZ((pa - pb) / se) < alpha && pa > pb) r.cells[a].sig.push(columns[b].letter);
        }
      });
    });
  }
  if (cfg.arrows && nC > 1){
    var nT = eff(0);
    rows.forEach(function(r){
      if (skip(r)) return;
      var pT = r.cells[0].pct; if (pT === null) return; pT /= 100;
      for (var c = 1; c < nC; c++){
        var nc = eff(c), pc = r.cells[c].pct;
        if (pc === null || !(nc >= 2)) continue;
        pc /= 100;
        var nRest = nT - nc, xRest = pT * nT - pc * nc;
        if (!(nRest >= 2) || xRest < 0 || xRest > nRest) continue;
        var pRest = xRest / nRest, pool = (pc * nc + xRest) / (nc + nRest);
        var se = Math.sqrt(pool * (1 - pool) * (1 / nc + 1 / nRest));
        if (!(se > 0)) continue;
        if (twoZ((pc - pRest) / se) < alpha) r.cells[c].vsTotal = pc > pRest ? '▲' : '▼';
      }
    });
  }
  var chi = [];
  if (o.chiSquare && !t.mr && !t.so){
    groups.forEach(function(g){
      var obs = [];
      rows.forEach(function(r){
        if (skip(r) || r.net) return;
        var line = []; for (var c = g.colStart; c <= g.colEnd; c++) line.push(r.cells[c].n);
        obs.push(line);
      });
      var res = T.chiSquare(obs);
      chi.push({ group:g.label, chi2:res.chi2, df:res.df, p:res.p });
    });
  }
  var meanRow = null, sdRow = null, medianRow = null, minRow = null, maxRow = null;
  var rowsOf = function(a){ return a ? pick(a).map(function(v){ return { v: v === undefined ? null : v }; }) : null; };
  if (t.med){ medianRow = rowsOf(t.med); minRow = rowsOf(t.min); maxRow = rowsOf(t.max); }
  if (t.mean){
    var mv = pick(t.mean), sv = pick(t.sd);
    meanRow = mv.map(function(v, c){ return { v: v === undefined ? null : v, n: bn[c], sig: [] }; });
    sdRow = sv.map(function(v){ return { v: v === undefined ? null : v }; });
    if (cfg.sig){
      groups.forEach(function(g){
        for (var a = g.colStart; a <= g.colEnd; a++) for (var b = g.colStart; b <= g.colEnd; b++){
          if (a === b) continue;
          var n1 = eff(a), n2 = eff(b);
          if (!(n1 > 2 && n2 > 2)) continue;
          var m1 = meanRow[a].v, m2 = meanRow[b].v, s1 = sdRow[a].v, s2 = sdRow[b].v;
          if (m1 === null || m2 === null) continue;
          var sp = Math.sqrt(s1 * s1 / n1 + s2 * s2 / n2);
          if (!(sp > 0)) continue;
          var tt = (m1 - m2) / sp;
          var df = Math.pow(s1 * s1 / n1 + s2 * s2 / n2, 2) /
                   (Math.pow(s1 * s1 / n1, 2) / (n1 - 1) + Math.pow(s2 * s2 / n2, 2) / (n2 - 1));
          if (T.tTestP(tt, df) < alpha && m1 > m2) meanRow[a].sig.push(columns[b].letter);
        }
      });
    }
  }
  return { columns:columns, groups:groups, rows:rows, baseN:bn, baseW:bw, baseEff:be, chi:chi,
           meanRow:meanRow, sdRow:sdRow, medianRow:medianRow, minRow:minRow, maxRow:maxRow,
           statList: t.st || ['mean', 'sd'], statsOnly: !!t.so, excludedLabels: t.ex || [], exclIsSet: !!t.exs, sigUsed:cfg.sig, weighted:!!D.weighted };
}
function modelFor(t, o, cfg){
  var m = E.buildModel(makeTable(t, o, cfg), { title:t.t, subtitle:null }, o);

}

(function(){ try{ var w = parseInt(localStorage.getItem(SIDE_KEY), 10); if (w >= 180 && w <= 640) applySideW(w); }catch(e){} })();
function sideResizer(lay){

  var set = function(w){
    w = Math.round(Math.max(180, Math.min(640, window.innerWidth - 360, w)));
    applySideW(w);
    try{ localStorage.setItem(SIDE_KEY, String(w)); }catch(e){}
    fitSides();
  };
  r.addEventListener('pointerdown', function(e){
    drag = true; x0 = e.clientX; w0 = cur();
    try{ r.setPointerCapture(e.pointerId); }catch(err){}
    document.body.classList.add('resizing'); e.preventDefault();
  });
  r.addEventListener('pointermove', function(e){ if (drag) set(w0 + e.clientX - x0); });
  var stop = function(){
    if (!drag) return;
    drag = false; document.body.classList.remove('resizing');
    Array.prototype.forEach.call(document.querySelectorAll('.view:not([hidden]) .card'), applySticky);
  };
  r.addEventListener('pointerup', stop); r.addEventListener('pointercancel', stop);
  r.addEventListener('dblclick', function(){ set(SIDE_DEF); });
  r.addEventListener('keydown', function(e){

/* ---------------- custom reports ---------------- */
/* C.reports: [{ name, orient, items:[ {k:'q', v, t, view, bn:[banner labels], sig, arrows, n, brk:label|'', type} | {k:'h', text} | {k:'c', text}
   | {k:'k', …card} | {k:'s', …summary} | {k:'p', text} ] }]
   C.atabs: the author's tabs shipped with the report (D.atabs); they open as tabs -10, -11, … and are locked for the reader.
   In the author's builder (D.author) the author's tabs are edited as C.reports and every change goes back to the tool. */
var C = { reports: [], atabs: [], tab: -1 };
var ATAB = -10;
function isLocked(){ return C.tab <= ATAB; }
/* cards and card-sized progress bars stand side by side */
function isTile(it){ return it.k === 'k' || (it.k === 'g' && it.look === 'card'); }
function authorMode(){ return !!D.author; }
function delLabel(){ return authorMode() ? tx.delTab : tx.delReport; }
var custSaveTimer = null;

function storeKey(){
  var s = (D.title || '') + '|' + D.tables.map(function(t){ return t.v || t.t; }).join(',');
  var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return 'spss-ctab-myreports:' + (h >>> 0).toString(36);
}
function cleanReports(){
  return JSON.parse(JSON.stringify(C.reports, function(k, v){ return k.charAt(0) === '_' ? undefined : v; }));
}
/* undo: every committed change keeps the previous state of all reports (typing is grouped into one step) */
var HIST = [], histTimer = null;
function commitHist(){
  clearTimeout(histTimer); histTimer = null;
  var now = JSON.stringify(cleanReports());
  if (C._last !== undefined && now !== C._last){
    HIST.push(C._last);
    if (HIST.length > 60) HIST.shift();
  }
  C._last = now;
  updUndo();
}
function updUndo(){
  var b = $('undoBtn'); if (b) b.disabled = !HIST.length;
}
function undo(){
  if (histTimer) commitHist();
  if (!HIST.length) return;
  var prev = JSON.parse(HIST.pop()), before = cleanReports();
  /* open the report that the undone step changed */
  var tab = -1, n = Math.max(prev.length, before.length);
  for (var i = 0; i < n; i++){
    if (JSON.stringify(prev[i]) !== JSON.stringify(before[i])){ tab = i; break; }
  }
  C.reports = prev;
  C._last = JSON.stringify(prev);
  if (tab >= prev.length) tab = prev.length - 1;
  if (tab < 0) tab = prev.length ? Math.min(Math.max(C.tab, 0), prev.length - 1) : -1;
  showTab(tab);
  updUndo();
  saveCustomLocal(false, true);
  toast(tx.undone);
}
function saveCustomLocal(typing, noHist){
  if (!noHist){
    if (typing){ clearTimeout(histTimer); histTimer = setTimeout(commitHist, 800); }
    else commitHist();
  }
  clearTimeout(custSaveTimer);
  custSaveTimer = setTimeout(function(){
    if (authorMode()){
      /* the builder runs inside the tool: the tabs go back to it, not to this browser's storage */
      try { window.parent.postMessage({ type:'spss-atabs', tabs: cleanReports() }, '*'); } catch (e) {}
      return;
    }
    try { localStorage.setItem(storeKey(), JSON.stringify({ reports: cleanReports(), tab: C.tab })); }
    catch (e) { if (!C._warned){ C._warned = true; toast(tx.noStore); } }
  }, 250);
}
function loadCustomLocal(){
  C.atabs = (Array.isArray(D.atabs) ? D.atabs : []).filter(validReport);
  if (authorMode()){
    C.reports = JSON.parse(JSON.stringify(C.atabs)); C.atabs = [];
    C._last = JSON.stringify(cleanReports());
    showTab(C.reports.length ? 0 : -1);
    return;
  }
  try {
    var raw = localStorage.getItem(storeKey());
    var o = raw ? JSON.parse(raw) : null;
    if (o && Array.isArray(o.reports)) C.reports = o.reports.filter(validReport);
    if (o && typeof o.tab === 'number' && o.tab < C.reports.length) C.tab = o.tab;
  } catch (e) { /* storage unavailable: start empty */ }
  C._last = JSON.stringify(cleanReports());
  /* the first tab of the author's order opens first */
  var first = tabOrder()[0];
  showTab(first === undefined ? -1 : first);
}
/* the author's order of the main tab and the author's tabs, as tab ids */
function tabOrder(){
  var out = [], seen = {};
  (Array.isArray(D.tabOrder) ? D.tabOrder : []).forEach(function(k){
    var ai = -1;
    C.atabs.forEach(function(r, i){ if (r.id === k) ai = i; });
    var id = k === 'main' ? -1 : ai >= 0 ? ATAB - ai : null;
    if (id === null || seen[id]) return;
    seen[id] = 1; out.push(id);
  });
  if (!seen[-1]) out.unshift(-1);
  C.atabs.forEach(function(r, i){ if (!seen[ATAB - i]) out.push(ATAB - i); });
  return out;
}
function validReport(r){ return r && typeof r === 'object' && Array.isArray(r.items); }

function tableIndex(it){

  if (i < 0) D.tables.some(function(t, k){ if (it.v && t.v === it.v){ i = k; return true; } return false; });
  if (i < 0) D.tables.some(function(t, k){ if (t.t === it.t){ i = k; return true; } return false; });

    row.classList.add('dragging');

  var apply = function(){ if (changed){ changed = false; rerenderItem(idx); } };
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = panel.hidden;
    closePanels(panel);
    if (!open){ panel.hidden = true; btn.setAttribute('aria-expanded', 'false'); apply(); return; }
    panel.hidden = false; btn.setAttribute('aria-expanded', 'true');
  });
  panel.addEventListener('click', function(e){ e.stopPropagation(); });
  /* the table refreshes once the list closes, so several boxes can be ticked in one go */
  new MutationObserver(function(){ if (panel.hidden) apply(); }).observe(panel, { attributes:true, attributeFilter:['hidden'] });
  wrap.appendChild(btn); wrap.appendChild(panel);
  return wrap;
}

/* ---------------- author's elements: figure cards, summaries, the sample block ----------------
   Every figure is read from a table of the report (the same numbers, weight and bases), so a report saved
   again on a new data file shows the new figures.
   card    {k:'k', v, t, stat:'pct'|'mean'|'n', rows:[row labels], label, grp:banner label|'', cat:category label}
           One figure for the whole sample or one group, with a mark when the group differs significantly from the rest.
   summary {k:'s', title, split, rows:[{v, t, stat, rows, label}]}
   sample  {k:'p', text}
   progress{k:'g', look:'block'|'card', title, total:target|null, src:''|'table'|'banner', v, t | b, targets:{category:target}, undef}
           Actual numbers of interviews (unweighted) against targets the author types in. */

function metricTable(spec){ var i = tableIndex(spec); return i >= 0 ? D.tables[i] : null; }
function metricRows(t, spec){ return t.rows.filter(function(r){ return (spec.rows || []).indexOf(r.l) >= 0; }); }
/* one figure in one column of the table (0 = Total) */
function metricValue(spec, col){
  var t = metricTable(spec); if (!t) return null;
  var n = t.bn[col];
  var rs = spec.stat === 'mean' ? [] : metricRows(t, spec);
  /* the actual (unweighted) number of respondents who gave the chosen answers, as in the tables' n */
  var c = rs.length ? rs.reduce(function(a, r){ return a + ((r.n || [])[col] || 0); }, 0) : null;
  if (spec.stat === 'n') return { v: c === null ? n : c, n:n, c:c, kind:'n' };
  if (spec.stat === 'mean'){
    if (!t.mean) return null;
    var m = t.mean[col];
    return { v: m === null || m === undefined ? null : m, n:n, kind:'mean' };
  }
  if (!rs.length) return null;
  var w = 0; rs.forEach(function(r){ w += r.w[col] || 0; });
  var base = t.bw[col];
  return { v: base > 0 ? 100 * w / base : null, n:n, c:c, kind:'pct' };
}
function metricText(mv){
  if (!mv || mv.v === null || mv.v === undefined || isNaN(mv.v)) return '–';
  if (mv.kind === 'n') return Math.round(mv.v).toLocaleString(D.lang === 'uk' ? 'uk-UA' : 'en-GB');
  if (mv.kind === 'mean') return fmt(mv.v, 1);
  return fmt(mv.v, D.opts.decimals === undefined ? 1 : D.opts.decimals) + '%';
}
function lowBase(mv){ return !!(mv && D.opts.minBase && mv.n < D.opts.minBase); }
/* full = a card's caption: the question and the chosen answers; otherwise (summary rows) the answers alone */
function metricLabel(spec, full){
  if (spec.label) return spec.label;
  var t = metricTable(spec), q = t ? t.t : (spec.t || '');
  var who = full && spec.grp && spec.cat ? ' · ' + spec.cat : '';
  if (spec.stat === 'mean') return q + ': ' + tx.mean.toLowerCase() + who;
  var a = (spec.rows || []).join(' + ');
  if (spec.stat === 'n' && !a) return full ? q + ' — ' + tx.kN + who : tx.kN;
  if (!full) return a || q;
  return (a ? q + ' — ' + a : q) + who;
}
/* the column a card shows: 0 = the whole sample, otherwise one category of a banner variable; -1 = not in this file */
function cardCol(it){
  if (!it.grp) return 0;
  var g = bannerIndex(it.grp); if (g < 0) return -1;
  var ci = D.banner[g].cats.indexOf(it.cat); return ci < 0 ? -1 : D.banner[g].start + ci;
}
/* a group against the rest of the sample: '▲' / '▼' when the difference is significant, as the arrows in the tables */
function cardSig(it, col, mv){
  if (!(col > 0) || !mv || mv.v === null || mv.v === undefined || D.opts.sigEnabled === false) return '';
  var t = metricTable(it); if (!t) return '';
  var eff = function(c){ return (!D.weighted || D.opts.sigBase === 'unweighted' || !t.be) ? t.bn[c] : t.be[c]; };
  var alpha = 1 - (D.opts.sigLevel || 0.95), nT = eff(0), nc = eff(col), nR = nT - nc, p, d;
  if (!(nc >= 2) || !(nR >= 2)) return '';
  if (mv.kind === 'mean'){
    if (!t.sd) return '';
    var mT = t.mean[0], sT = t.sd[0], mc = t.mean[col], sc = t.sd[col];
    if ([mT, sT, mc, sc].some(function(x){ return x === null || x === undefined || isNaN(x); })) return '';
    var mR = (mT * nT - mc * nc) / nR;
    var vR = ((nT - 1) * sT * sT + nT * mT * mT - (nc - 1) * sc * sc - nc * mc * mc - nR * mR * mR) / (nR - 1);
    if (!(vR > 0)) return '';
    var a1 = sc * sc / nc, a2 = vR / nR, se = Math.sqrt(a1 + a2);
    if (!(se > 0)) return '';
    var df = Math.pow(a1 + a2, 2) / (a1 * a1 / (nc - 1) + a2 * a2 / (nR - 1));
    p = T.tTestP((mc - mR) / se, df); d = mc - mR;
  } else {
    var rs = metricRows(t, it); if (!rs.length) return '';
    var sum = function(c){ return rs.reduce(function(x, r){ return x + (r.w[c] || 0); }, 0); };
    if (!(t.bw[0] > 0) || !(t.bw[col] > 0)) return '';
    var pT = sum(0) / t.bw[0], pc = sum(col) / t.bw[col];
    var xR = pT * nT - pc * nc; if (xR < 0 || xR > nR) return '';
    var pR = xR / nR, pool = (pc * nc + xR) / (nc + nR);
    var se2 = Math.sqrt(pool * (1 - pool) * (1 / nc + 1 / nR));
    if (!(se2 > 0)) return '';
    p = 2 * (1 - T.normCdf(Math.abs((pc - pR) / se2))); d = pc - pR;
  }
  return p < alpha ? (d > 0 ? '▲' : '▼') : '';
}
function sigTip(){ return tx.kSigTip.replace('{l}', Math.round(100 * (D.opts.sigLevel || 0.95))); }
function splitCols(split){
  var g = split ? bannerIndex(split) : -1;
  if (g < 0) return [];
  return D.banner[g].cats.map(function(c, ci){ return { label:c, col: D.banner[g].start + ci }; });
}
function nCountText(mv){
  if (!mv || mv.c === null || mv.c === undefined) return nText(mv && mv.n);
  var f = function(x){ return Math.round(x).toLocaleString(D.lang === 'uk' ? 'uk-UA' : 'en-GB'); };
  return tx.kNOf.replace('{c}', f(mv.c)).replace('{n}', f(mv.n));
}
/* the small line under a card's figure: the answer count and its base (for a count: the base only) */
function metricNote(spec, mv){
  if (spec.stat !== 'n') return nCountText(mv);
  if (!mv || mv.c === null || mv.c === undefined) return '';
  return tx.kOfBase.replace('{n}', Math.round(mv.n).toLocaleString(D.lang === 'uk' ? 'uk-UA' : 'en-GB'));
}
function nText(n){ return 'n = ' + (n === null || n === undefined ? '–' : Math.round(n).toLocaleString(D.lang === 'uk' ? 'uk-UA' : 'en-GB')); }

/* the card editor: question → answers → for whom → caption, with the card itself as the preview */
function openCardEditor(src, onSave){
  var it = JSON.parse(JSON.stringify(src, function(k, v){ return k.charAt(0) === '_' ? undefined : v; }));
  ['split', 'bar', 'hi', 'lo', 'note'].forEach(function(k){ delete it[k]; });
  it.rows = it.rows || []; it.stat = it.stat || 'pct';
  var md = openDialog(src.v || src.t ? tx.editCard : tx.newCard);
  var wrap = el('div', 'kedit'), form = el('div', 'kform'), side = el('div', 'kside');
  wrap.appendChild(form); wrap.appendChild(side); md.body.appendChild(wrap);
  /* 1 question */
  var tsel = el('select'); tsel.id = 'kQ';
  var o0 = el('option', '', tx.kPickTable); o0.value = '-1'; tsel.appendChild(o0);
  D.tables.forEach(function(t, i){ var op = el('option', '', (i + 1) + '. ' + t.t); op.value = String(i); tsel.appendChild(op); });
  tsel.value = String((it.v || it.t) ? tableIndex(it) : -1);
  form.appendChild(field(tx.kStep1, tsel));
  /* 2 what to show + answers */
  var statBox = el('div'); var statField = field(tx.kStep2, statBox); form.appendChild(statField);
  var rowsBox = el('div', 'kchips'); rowsBox.id = 'kRows'; var rowsField = field(tx.kStep3, rowsBox, ''); form.appendChild(rowsField);
  /* 3 for whom */
  var gsel = el('select'); gsel.id = 'kFor';
  var a0 = el('option', '', tx.kAll); a0.value = ''; gsel.appendChild(a0);
  D.banner.forEach(function(b){
    var og = el('optgroup'); og.label = b.label;
    b.cats.forEach(function(c){ var op = el('option', '', c); op.value = b.label + '\u0001' + c; og.appendChild(op); });
    gsel.appendChild(og);
  });
  gsel.value = it.grp && cardCol(it) > 0 ? it.grp + '\u0001' + it.cat : '';
  var forField = field(tx.kStep4, gsel, D.banner.length ? tx.kForHint : undefined);
  if (!D.banner.length) forField.style.display = 'none';
  form.appendChild(forField);
  /* 4 caption */
  var lab = el('input'); lab.type = 'text'; lab.id = 'kCap'; lab.value = it.label || '';
  form.appendChild(field(tx.kLabel, lab, tx.kLabelAuto));
  /* the card as it will look */
  side.appendChild(el('div', 'kpvl', tx.kPvCard));
  var pv = el('section', 'ccard xk kpv'); side.appendChild(pv);

  var t = function(){ var i = parseInt(tsel.value, 10); return i >= 0 ? D.tables[i] : null; };
  var spec = function(){
    var tt = t(), g = gsel.value.split('\u0001');
    return { k:'k', v: tt ? tt.v || '' : '', t: tt ? tt.t : '', _i: parseInt(tsel.value, 10), stat: it.stat, rows: it.rows.slice(),
             label: lab.value.trim(), grp: g.length > 1 ? g[0] : '', cat: g.length > 1 ? g[1] : '' };
  };
  var ready = function(){ var tt = t(); return !!tt && (it.stat === 'mean' || it.rows.length > 0 || (it.stat === 'n' && tt.so)); };
  var paint = function(){
    var sp = spec(); pv.innerHTML = '';
    lab.placeholder = t() ? metricLabel(Object.assign({}, sp, { label:'' }), true) : tx.kLabelPh;
    if (!ready()){ pv.classList.add('empty'); pv.appendChild(el('div', 'kpvhint', !t() ? tx.kPickTable : tx.kNeedRows)); }
    else { pv.classList.remove('empty'); fillCard(pv, sp); }
    ok.disabled = !ready();
  };
  var paintRows = function(){
    var tt = t(); rowsBox.innerHTML = '';
    var show = !!tt && it.stat !== 'mean' && !tt.so;
    rowsField.style.display = show ? '' : 'none';
    if (show){
      var single = !!tt.mr;
      rowsField.querySelector('.rfh').textContent = single ? tx.kRowsMr : tx.kRowsPick;
      it.rows = it.rows.filter(function(l){ return tt.rows.some(function(r){ return r.l === l; }); });
      if (single && it.rows.length > 1) it.rows = it.rows.slice(0, 1);
      tt.rows.forEach(function(r){
        if (r.m && !D.opts.includeMissing) return;
        var on = it.rows.indexOf(r.l) >= 0;
        var b = el('button', 'kchip' + (r.nt ? ' net' : ''), r.l); b.type = 'button'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
        b.addEventListener('click', function(){
          var was = it.rows.indexOf(r.l) >= 0;
          if (single) it.rows = was ? [] : [r.l];
          else if (was) it.rows = it.rows.filter(function(x){ return x !== r.l; });
          else it.rows.push(r.l);
          paintRows();
        });
        rowsBox.appendChild(b);
      });
    }
    paint();
  };
  var paintStat = function(){
    var tt = t(); statBox.innerHTML = '';
    if (it.stat === 'mean' && !(tt && tt.mean)) it.stat = 'pct';
    if (it.stat === 'pct' && tt && tt.so) it.stat = tt.mean ? 'mean' : 'n';
    statField.style.display = tt ? '' : 'none';
    statBox.appendChild(segPick([['pct', tx.kPct, tt && tt.so], ['n', tx.kN], ['mean', tx.kMean, !(tt && tt.mean)]], it.stat, function(v){ it.stat = v; paintRows(); }));
    paintRows();
  };
  tsel.addEventListener('change', function(){ it.rows = []; paintStat(); });
  gsel.addEventListener('change', paint);
  lab.addEventListener('input', paint);
  var cancel = el('button', 'btn', tx.cancel); cancel.type = 'button';
  cancel.addEventListener('click', function(){ md.close(true); });
  var ok = el('button', 'btn primary', tx.saveIt); ok.type = 'button'; ok.id = 'mSave';
  ok.addEventListener('click', function(){
    if (!ready()) return;
    var sp = spec(); delete sp._i;
    if (it.stat === 'mean') sp.rows = [];
    md.close(false); onSave(sp);
  });
  md.foot.appendChild(cancel); md.foot.appendChild(ok);
  paintStat();
  setTimeout(function(){ try{ tsel.focus(); }catch(e){} }, 0);
}
function openSummaryEditor(src, onSave){
  var it = JSON.parse(JSON.stringify(src, function(k, v){ return k.charAt(0) === '_' ? undefined : v; }));
  it.rows = it.rows || [];
  var md = openDialog(tx.editSummary);
  var title = el('input'); title.type = 'text'; title.value = it.title || ''; title.placeholder = tx.sumTitlePh;
  md.body.appendChild(field(tx.sumTitle, title));
  var ssel = el('select');
  var n0 = el('option', '', tx.kNoSplit); n0.value = ''; ssel.appendChild(n0);
  D.banner.forEach(function(b){ var op = el('option', '', b.label); op.value = b.label; ssel.appendChild(op); });
  ssel.value = it.split && bannerIndex(it.split) >= 0 ? it.split : '';
  md.body.appendChild(field(tx.sumCols, ssel));
  var list = el('div', 'rmlist'); md.body.appendChild(field(tx.sumRows, list));
  var paint = function(){
    list.innerHTML = '';
    if (!it.rows.length) list.appendChild(el('div', 'rfh', tx.sumEmpty));
    it.rows.forEach(function(spec, k){
      var row = el('div', 'rmrow');
      row.appendChild(el('span', 'rmn', (k + 1) + '.'));
      var tt = el('div', 'rmt'); tt.appendChild(el('b', '', metricLabel(spec))); tt.appendChild(el('small', '', spec.t || ''));
      row.appendChild(tt);
      var up = el('button', 'ib', '↑'); up.type = 'button'; up.disabled = k === 0; up.title = tx.up;
      up.addEventListener('click', function(){ it.rows.splice(k - 1, 0, it.rows.splice(k, 1)[0]); paint(); });
      var ed = el('button', 'ib', '✎'); ed.type = 'button'; ed.title = tx.edit;
      ed.addEventListener('click', function(){ hide(); openMetricEditor(spec, false, function(n){ it.rows[k] = n; show(); }, show); });
      var rm = el('button', 'ib rm', '×'); rm.type = 'button'; rm.title = tx.del;
      rm.addEventListener('click', function(){ it.rows.splice(k, 1); paint(); });
      row.appendChild(up); row.appendChild(ed); row.appendChild(rm);
      list.appendChild(row);
    });
  };
  /* the figure editor opens over this one; this one waits hidden and comes back */
  var ov = $('rmodal');
  var hide = function(){ ov.id = 'rmodal-wait'; ov.style.display = 'none'; };
  var show = function(){ ov.id = 'rmodal'; ov.style.display = ''; paint(); };
  var add = el('button', 'btn sm', tx.sumAdd); add.type = 'button';
  add.addEventListener('click', function(){ hide(); openMetricEditor({ stat:'pct', rows:[] }, false, function(n){ it.rows.push(n); show(); }, show); });
  md.body.appendChild(add);
  paint();
  var cancel = el('button', 'btn', tx.cancel); cancel.type = 'button';
  cancel.addEventListener('click', function(){ md.close(true); });
  var ok = el('button', 'btn primary', tx.saveIt); ok.type = 'button'; ok.id = 'sSave';
  ok.addEventListener('click', function(){
    it.title = title.value.trim(); it.split = ssel.value;
    md.close(false); onSave(it);
  });
  md.foot.appendChild(cancel); md.foot.appendChild(ok);
}

/* ---- progress against targets ---- */
function intText(n){ return Math.round(n).toLocaleString(D.lang === 'uk' ? 'uk-UA' : 'en-GB'); }
/* the categories of the chosen source with their actual counts; undef = cases with no category */
function progressSource(it){
  if (it.src === 'table'){
    var t = metricTable(it); if (!t) return { missing:true, cats:[] };
    var cats = t.rows.filter(function(r){ return !r.nt; }).map(function(r){ return { label:r.l, n:r.n[0] || 0 }; });
    var sum = 0; cats.forEach(function(c){ sum += c.n; });
    return { cats:cats, undef: Math.max(0, (D.n || t.bn[0] || 0) - sum) };
  }
  if (it.src === 'banner'){
    var g = bannerIndex(it.b); if (g < 0 || !D.banner[g].cn) return { missing:true, cats:[] };
    var b = D.banner[g], s2 = 0;
    var list = b.cats.map(function(c, k){ s2 += b.cn[k] || 0; return { label:c, n:b.cn[k] || 0 }; });
    return { cats:list, undef: Math.max(0, (D.n || 0) - s2) };
  }
  return { cats:[] };
}
function progressBars(it){
  var bars = [], targets = it.targets || {};
  if (it.total !== null && it.total !== undefined && it.total !== '') bars.push({ label: tx.gTotal, n: D.n || 0, target: +it.total, total:true });
  var src = progressSource(it);
  src.cats.forEach(function(c){
    var tg = targets[c.label];
    bars.push({ label:c.label, n:c.n, target: tg === undefined || tg === null || tg === '' ? null : +tg });
  });
  if (it.src && it.undef && src.undef > 0) bars.push({ label: tx.gUndef, n: src.undef, target:null, undef:true });
  return { bars:bars, missing: !!src.missing };
}
function barRow(b){
  var row = el('div', 'gbar' + (b.total ? ' tot' : '') + (b.undef ? ' undef' : ''));
  var top = el('div', 'gtop');
  top.appendChild(el('span', 'glab', b.label));
  var val;
  if (b.target > 0){
    var pct = 100 * b.n / b.target, over = b.n - b.target;
    val = intText(b.n) + ' ' + tx.gOf + ' ' + intText(b.target) + ' · ' + fmt(pct, 0) + '%' + (over > 0 ? ' (+' + intText(over) + ')' : '');
    if (b.n >= b.target) row.classList.add('done');
  } else val = intText(b.n);
  top.appendChild(el('span', 'gval', val));
  row.appendChild(top);
  if (b.target > 0){
    var bar = el('div', 'gtrack'), fill = el('i');
    fill.style.width = Math.min(100, 100 * b.n / b.target) + '%';
    bar.appendChild(fill); row.appendChild(bar);
  }
  return row;
}
function fillProgress(card, it){
  card.appendChild(el(it.look === 'card' ? 'div' : 'h3', it.look === 'card' ? 'kl' : 'xtitle', progTitle(it)));
  var res = progressBars(it), box = el('div', 'gbars');
  /* a card with one bar reads like a figure card: a big number, then “of target · %” and the bar */
  if (it.look === 'card' && res.bars.length === 1 && res.bars[0].target > 0 && !res.missing){
    var b = res.bars[0], done = b.n >= b.target, over = b.n - b.target;
    var big = el('div', 'kv' + (done ? ' good' : ''), intText(b.n)); card.appendChild(big);
    card.appendChild(el('div', 'gsub', tx.gOf + ' ' + intText(b.target) + ' · ' + fmt(100 * b.n / b.target, 0) + '%' + (over > 0 ? ' (+' + intText(over) + ')' : '')));
    var tr = el('div', 'gtrack' + (done ? ' done' : '')), fi = el('i'); fi.style.width = Math.min(100, 100 * b.n / b.target) + '%';
    tr.appendChild(fi); card.appendChild(tr);
    box = null;
  }
  if (box && res.missing) box.appendChild(el('div', 'kmiss', tx.kMissing.replace('{t}', it.t || it.b || it.v || '')));
  if (box){
    res.bars.forEach(function(b){ box.appendChild(barRow(b)); });
    if (!res.bars.length && !res.missing) box.appendChild(el('div', 'knote', tx.gEmpty));
    card.appendChild(box);
  }
}
/* ---- open answers and quotes ---- */
function fillOpen(card, it, idx){
  var x = openByKey(it.key);
  card.appendChild(el('h3', 'xtitle', x ? x.t : it.t || it.key));
  if (!x){ card.classList.add('miss'); card.appendChild(el('div', 'kmiss', tx.qMissing.replace('{t}', it.t || it.key))); return; }
  card.appendChild(openEl(x, false, 'c' + C.tab + ':' + idx));
}
function fillQuotes(card, it){
  var x = openByKey(it.key);
  if (it.title) card.appendChild(el('h3', 'xtitle', it.title));
  var grid = el('div', 'xquotes');
  (it.quotes || []).forEach(function(q){ grid.appendChild(el('blockquote', 'xquote', q)); });
  card.appendChild(grid);
  card.appendChild(el('div', 'xqsrc', '— ' + (x ? x.t : it.t || it.key)));
}
/* the quotes editor: the question, then a click on each answer to show; the quotes themselves as the preview */
function openQuotesEditor(src, onSave){
  var it = JSON.parse(JSON.stringify(src, function(k, v){ return k.charAt(0) === '_' ? undefined : v; }));
  it.quotes = it.quotes || [];
  var md = openDialog(tx.qEdit);
  var wrap = el('div', 'kedit qedit'), form = el('div', 'kform'), side = el('div', 'kside');
  wrap.appendChild(form); wrap.appendChild(side); md.body.appendChild(wrap);
  var qsel = el('select'); qsel.id = 'qQ';
  (D.opens || []).forEach(function(x){ var op = el('option', '', x.t); op.value = x.k; qsel.appendChild(op); });
  if (openByKey(it.key)) qsel.value = it.key;
  form.appendChild(field(tx.qQuestion, qsel));
  var title = el('input'); title.type = 'text'; title.id = 'qTitle'; title.value = it.title || ''; title.placeholder = tx.qTitlePh;
  form.appendChild(field(tx.qTitleLbl, title));
  var pickBox = el('div', 'qpick');
  var search = el('input', 'osearch'); search.type = 'search'; search.placeholder = tx.oSearch; search.setAttribute('aria-label', tx.oSearch);
  var count = el('span', 'qcount');
  var tools = el('div', 'qtools'); tools.appendChild(search); tools.appendChild(count);
  var list = el('div', 'qlist'); list.id = 'qList';
  pickBox.appendChild(tools); pickBox.appendChild(list);
  form.appendChild(field(tx.qPick, pickBox, tx.qPickHint));
  side.appendChild(el('div', 'kpvl', tx.qPv));
  var pv = el('section', 'ccard xx kpv'); side.appendChild(pv);
  var paint = function(){
    pv.innerHTML = '';
    var x = openByKey(qsel.value);
    if (!it.quotes.length){ pv.classList.add('empty'); pv.appendChild(el('div', 'kpvhint', tx.qNeed)); }
    else { pv.classList.remove('empty'); fillQuotes(pv, { key: qsel.value, title: title.value.trim(), quotes: it.quotes, t: x ? x.t : '' }); }
    count.textContent = tx.qChosen.replace('{n}', it.quotes.length);
    ok.disabled = !it.quotes.length;
  };
  var paintList = function(){
    list.innerHTML = '';
    var x = openByKey(qsel.value); if (!x) return;
    var qq = OpenView.norm(search.value || '');
    OpenView.groups(x.it.map(function(a){ return { t:a[0] }; })).forEach(function(g){
      if (qq && OpenView.norm(g.t).indexOf(qq) < 0) return;
      var on = it.quotes.indexOf(g.t) >= 0;
      var b = el('button', 'qitem', ''); b.type = 'button'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.appendChild(el('span', 'qt', g.t)); b.appendChild(el('span', 'qn', String(g.n)));
      b.addEventListener('click', function(){
        var k = it.quotes.indexOf(g.t);
        if (k >= 0) it.quotes.splice(k, 1); else it.quotes.push(g.t);
        b.setAttribute('aria-pressed', k >= 0 ? 'false' : 'true');
        paint();
      });
      list.appendChild(b);
    });
  };
  qsel.addEventListener('change', function(){ it.quotes = []; paintList(); paint(); });
  search.addEventListener('input', paintList);
  title.addEventListener('input', paint);
  var cancel = el('button', 'btn', tx.cancel); cancel.type = 'button';
  cancel.addEventListener('click', function(){ md.close(true); });
  var ok = el('button', 'btn primary', tx.saveIt); ok.type = 'button'; ok.id = 'qSave';
  ok.addEventListener('click', function(){
    if (!it.quotes.length) return;
    var x = openByKey(qsel.value);
    md.close(false);
    onSave({ k:'x', key: qsel.value, t: x ? x.t : '', title: title.value.trim(), quotes: it.quotes.slice() });
  });
  md.foot.appendChild(cancel); md.foot.appendChild(ok);
  paintList(); paint();
}

/* the title shown when the author leaves it empty */
function progTitle(it){
  if (it.title) return it.title;
  if (it.src === 'banner' && it.b) return tx.gQuota + ': ' + it.b;
  if (it.src === 'table'){ var t = metricTable(it); return tx.gQuota + ': ' + (t ? t.t : it.t || ''); }
  return tx.gTitle;
}
/* the progress editor: what to track → targets → look → title, with the element itself as the preview */
function openProgressEditor(src, onSave){
  var it = JSON.parse(JSON.stringify(src, function(k, v){ return k.charAt(0) === '_' ? undefined : v; }));
  it.targets = it.targets || {};
  var hasTot = it.total !== null && it.total !== undefined && it.total !== '';
  var mode = it.src ? 'quota' : 'total';
  var md = openDialog(tx.gEdit);
  var wrap = el('div', 'kedit gedit'), form = el('div', 'kform'), side = el('div', 'kside');
  wrap.appendChild(form); wrap.appendChild(side); md.body.appendChild(wrap);
  /* 1 what to track */
  var modeBox = segPick([['total', tx.gModeTotal], ['quota', tx.gModeQuota]], mode, function(v){ mode = v; paintMode(); });
  modeBox.id = 'gMode';
  form.appendChild(field(tx.gStep1, modeBox));
  /* total: one target */
  var totPart = el('div', 'gpart');
  var totIn = el('input'); totIn.type = 'number'; totIn.min = '0'; totIn.id = 'gTot'; totIn.placeholder = tx.gTargetPh;
  totIn.value = hasTot ? it.total : '';
  totPart.appendChild(field(tx.gStepTot, totIn, tx.gNowAll.replace('{n}', intText(D.n || 0))));
  form.appendChild(totPart);
  /* quotas: a variable, a target for each group */
  var qPart = el('div', 'gpart');
  var sel = el('select'); sel.id = 'gSrc';
  var o0 = el('option', '', tx.gPickVar); o0.value = ''; sel.appendChild(o0);
  var og1 = el('optgroup'); og1.label = tx.gFromBanner;
  D.banner.forEach(function(b){ if (!b.cn) return; var op = el('option', '', b.label); op.value = 'b:' + b.label; og1.appendChild(op); });
  if (og1.children.length) sel.appendChild(og1);
  var og2 = el('optgroup'); og2.label = tx.gFromTable;
  D.tables.forEach(function(t, i){ if (t.mr || t.so) return; var op = el('option', '', (i + 1) + '. ' + t.t); op.value = 't:' + i; og2.appendChild(op); });
  if (og2.children.length) sel.appendChild(og2);
  sel.value = it.src === 'banner' && bannerIndex(it.b) >= 0 ? 'b:' + it.b : it.src === 'table' && tableIndex(it) >= 0 ? 't:' + tableIndex(it) : '';
  qPart.appendChild(field(tx.gStepVar, sel, tx.gSourceHint));
  var gridBox = el('div'); var gridField = field(tx.gStepTargets, gridBox, tx.gCatsHint); qPart.appendChild(gridField);
  var optBox = el('div', 'gopts');
  var totOnL = el('label', 'rcheck'); var totOn = el('input'); totOn.type = 'checkbox'; totOn.id = 'gTotOn'; totOn.checked = hasTot && mode === 'quota';
  totOnL.appendChild(totOn); totOnL.appendChild(el('span', '', tx.gAddTotal));
  var totIn2 = el('input'); totIn2.type = 'number'; totIn2.min = '0'; totIn2.id = 'gTot2'; totIn2.placeholder = tx.gTargetPh; totIn2.value = hasTot ? it.total : '';
  totIn2.setAttribute('aria-label', tx.gTotal + ': ' + tx.gTarget);
  var totRow = el('div', 'gtotrow'); totRow.appendChild(totOnL); totRow.appendChild(totIn2);
  optBox.appendChild(totRow);
  var undL = el('label', 'rcheck'); var undC = el('input'); undC.type = 'checkbox'; undC.id = 'gUndef'; undC.checked = it.undef !== false;
  undL.appendChild(undC); undL.appendChild(el('span', '', tx.gUndefOn));
  optBox.appendChild(undL);
  qPart.appendChild(optBox);
  form.appendChild(qPart);
  /* look and title */
  form.appendChild(field(tx.gLook, segPick([['block', tx.gBlock], ['card', tx.gCard]], it.look || 'block', function(v){ it.look = v; paint(); })));
  var title = el('input'); title.type = 'text'; title.id = 'gTitle'; title.value = it.title || '';
  form.appendChild(field(tx.gName, title, tx.gNameHint));
  /* the preview */
  side.appendChild(el('div', 'kpvl', tx.gPv));
  var pv = el('section', 'ccard xg kpv'); side.appendChild(pv);

  var inputs = {};
  var probe = function(){
    var v = sel.value; if (!v) return null;
    if (v.charAt(0) === 'b') return { src:'banner', b: v.slice(2) };
    var tt = D.tables[+v.slice(2)]; return { src:'table', v: tt.v || '', t: tt.t, _i: +v.slice(2) };
  };
  var spec = function(){
    var o = { k:'g', look: it.look || 'block', title: title.value.trim(), total:null, src:'', targets:{}, undef: undC.checked };
    if (mode === 'total'){ o.total = totIn.value !== '' ? +totIn.value : null; return o; }
    var p = probe(); if (p){ Object.assign(o, p); }
    if (totOn.checked && totIn2.value !== '') o.total = +totIn2.value;
    Object.keys(inputs).forEach(function(l){ if (inputs[l].value !== '') o.targets[l] = +inputs[l].value; });
    return o;
  };
  var ready = function(){ var o = spec(); return mode === 'total' ? o.total > 0 : !!o.src; };
  var paint = function(){
    var o = spec(); pv.innerHTML = '';
    pv.classList.toggle('gcard', o.look === 'card');
    title.placeholder = progTitle(Object.assign({}, o, { title:'' }));
    if (!ready()){ pv.classList.add('empty'); pv.appendChild(el('div', 'kpvhint', mode === 'total' ? tx.gNeedTot : tx.gPickVar)); }
    else { pv.classList.remove('empty'); fillProgress(pv, o); }
    totIn2.disabled = !totOn.checked;
    ok.disabled = !ready();
  };
  var paintGrid = function(){
    gridBox.innerHTML = ''; inputs = {};
    var p = probe();
    gridField.style.display = p ? '' : 'none';
    optBox.style.display = p ? '' : 'none';
    if (p){
      var res = progressSource(p);

/* the chart's numbers as a small workbook, so “Edit data” in Word opens them */
function dxChartWorkbook(cd){
  var vars = [{ name:' ', type:'string', data: cd.cats.slice() }];
  cd.series.forEach(function(s){ vars.push({ name: s.name, type:'numeric', data: s.vals.map(function(v){ return v === null || v === undefined ? NaN : Math.round(v * 10000) / 10000; }) }); });
  var rows = cd.cats.map(function(c, i){ return i; });
  return DataXlsx.build({ rows: rows, vars: vars, idIndex: -1, sheets: { codes:true, labels:false }, dict:false, log:null,
                          names: { codes:'Sheet1' }, dictHeader: [] })
    .then(function(b){ return b.arrayBuffer(); }).then(function(ab){ return new Uint8Array(ab); });
}
function dxChartHeight(type, cd, widthEmu){
  var inch = 914400, n = cd.cats.length, s = cd.series.length;
  if (type === 'pie') return Math.round(3.1 * inch);
  if (type === 'line') return Math.round(3.4 * inch);
  if (type === 'stack') return Math.round(Math.min(7.5, 0.9 + 0.38 * n + (s > 4 ? 0.3 : 0)) * inch);
  if (type === 'mean') return Math.round(Math.min(7.5, 0.6 + 0.34 * n) * inch);
  return Math.round(Math.min(8.5, 0.7 + n * (s > 1 ? 0.2 * s + 0.12 : 0.34) + (s > 1 ? 0.35 : 0)) * inch);

/* SVG -> PNG bytes (for picture charts and for logos) */
function dxRaster(src, maxW, scale){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){
      var w = img.naturalWidth || 760, h = img.naturalHeight || 400, k = Math.min(scale || 2, (maxW || 2000) / w);
      var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
      var ctx = c.getContext('2d'); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(b){
        if (!b){ reject(new Error('image')); return; }
        b.arrayBuffer().then(function(ab){ resolve({ bytes: new Uint8Array(ab), w: w, h: h }); });
      }, 'image/png');
    };
    img.onerror = function(){ reject(new Error('image')); };
    img.src = src;
  });
}
function dxSvgSrc(svg){
  var withSize = svg.replace('<svg ', '<svg width="' + W + '" ');
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(withSize);
}

function dxSplitGroups(groups, per, maxCols){
  var out = [], cur = [], cols = per;
  groups.forEach(function(g){
    var c = D.banner[g].cats.length * per;
    if (cur.length && cols + c > maxCols){ out.push(cur); cur = []; cols = per; }
    cur.push(g); cols += c;
  });
  if (cur.length || !out.length) out.push(cur);
  return out;
}

function dxCards(cards, usable, per){

      rows: rows,
      baseN: Array.prototype.slice.call(baseN),

      chi: chi,

/* ---------------- unified controls ----------------
   A short list of choices is shown as a segmented control (or colour swatches); the <select> stays in the page
   as the single source of the value, so settings, saving and loading work as before. */
var SELECT_VALUE = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
function segify(sel){
  if (!sel || sel.__seg) return;
  var mode = sel.getAttribute('data-seg') || '';          /* '' = text, 'ink' / 'fill' = colour swatches */
  var box = document.createElement('div');
  box.className = mode ? 'swatches' : 'segc';
  box.setAttribute('role', 'radiogroup');
  var cap = sel.parentNode && sel.parentNode.querySelector(':scope > span');
  if (cap){ if (!cap.id) cap.id = sel.id + 'Cap'; box.setAttribute('aria-labelledby', cap.id); }
  Array.prototype.forEach.call(sel.options, function(op){
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'radio');
    b.setAttribute('data-v', op.value);
    if (mode){
      b.className = 'swatch';
      var pal = PALETTE[op.value];
      if (pal){ b.style.background = '#' + pal[mode]; if (mode === 'ink') b.style.borderColor = '#' + pal.ink; }
      else b.classList.add('nocolor');
    } else {
      var t = document.createElement('span');
      var key = op.getAttribute('data-short') || op.getAttribute('data-i18n');
      if (key){ t.setAttribute('data-i18n', key); t.textContent = L(key); } else t.textContent = op.textContent;
      b.appendChild(t);
    }
    b.addEventListener('click', function(){
      if (SELECT_VALUE.get.call(sel) === op.value) return;
      SELECT_VALUE.set.call(sel, op.value); paint();
      sel.dispatchEvent(new Event('change', { bubbles:true }));
    });
    box.appendChild(b);
  });
  segKeys(box);
  function paint(){
    var v = SELECT_VALUE.get.call(sel);
    Array.prototype.forEach.call(box.children, function(b){
      var on = b.getAttribute('data-v') === v;
      b.setAttribute('aria-checked', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1;
    });
  }
  /* values set by code (loading settings) repaint the control too */
  Object.defineProperty(sel, 'value', { configurable:true,
    get: function(){ return SELECT_VALUE.get.call(sel); },
    set: function(v){ SELECT_VALUE.set.call(sel, v); paint(); } });
  sel.addEventListener('change', paint);
  sel.classList.add('vh'); sel.tabIndex = -1; sel.setAttribute('aria-hidden', 'true');
  sel.parentNode.insertBefore(box, sel.nextSibling);
  sel.__seg = { box:box, paint:paint };
  paint();
}
/* arrow keys move the choice inside a segmented control */
function segKeys(box){
  box.addEventListener('keydown', function(e){
    var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    var bs = Array.prototype.slice.call(box.children);
    var i = bs.indexOf(document.activeElement);
    if (i < 0) bs.forEach(function(b, k){ if (b.getAttribute('aria-checked') === 'true') i = k; });
    var nx = bs[(i + d + bs.length) % bs.length]; nx.click(); nx.focus();
  });
}
/* a segmented control built in code (dialogs): items are [value, text] */
function segChoice(items, value, onPick){
  var box = document.createElement('div'); box.className = 'segc'; box.setAttribute('role', 'radiogroup');
  var paint = function(v){
    Array.prototype.forEach.call(box.children, function(b){
      var on = b.getAttribute('data-v') === v; b.setAttribute('aria-checked', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1;
    });
  };
  items.forEach(function(p){
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('data-v', p[0]);
    b.textContent = p[1];
    b.addEventListener('click', function(){ paint(p[0]); onPick(p[0]); });
    box.appendChild(b);
  });
  segKeys(box); paint(value);
  return box;
}
/* an on/off option with an optional hint, in the panel's style */
function switchRow(id, text, checked, onChange, hint){
  var l = document.createElement('label'); l.className = 'opt';
  var c = document.createElement('input'); c.type = 'checkbox'; c.className = 'swi'; c.setAttribute('role', 'switch');
  if (id) c.id = id; c.checked = !!checked;
  if (onChange) c.addEventListener('change', function(){ onChange(c.checked); });
  var ot = document.createElement('span'); ot.className = 'ot';
  var ol = document.createElement('span'); ol.className = 'ol'; ol.textContent = text; ot.appendChild(ol);
  if (hint){ var oh = document.createElement('span'); oh.className = 'oh'; oh.textContent = hint; ot.appendChild(oh); }
  l.appendChild(c); l.appendChild(ot);
  return l;
}
function segTitles(){
  Array.prototype.forEach.call(document.querySelectorAll('select[data-seg]'), function(sel){
    if (!sel.__seg) return;
    Array.prototype.forEach.call(sel.__seg.box.children, function(b, i){
      var op = sel.options[i]; if (!op) return;
      if (sel.getAttribute('data-seg')){ b.title = op.textContent; b.setAttribute('aria-label', op.textContent); }
      else b.title = op.getAttribute('data-short') ? op.textContent : '';
    });
  });
}
/* options that only matter when another one is on are dimmed when it is off */
function syncDeps(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-dep]'), function(el){
    var on = el.getAttribute('data-dep').split('|').some(function(id){ var c = $(id); return c && c.checked; });
    el.classList.toggle('off', !on);
  });
}

var tabButtons = [], tabSections = [], activeTab = 0;
function buildTabs(){
  var panel = document.querySelector('.panel');
  var inner = document.querySelector('.panelinner');
  tabSections = Array.prototype.slice.call(inner.querySelectorAll('.sec'));
  var rail = document.createElement('div'); rail.className = 'rail'; rail.id = 'secRail'; rail.setAttribute('role', 'tablist');
  tabSections.forEach(function(sec, i){
    sec.open = true;
    var summary = sec.querySelector('summary');
    var keyEl = summary ? summary.querySelector('[data-i18n]') : null;
    var cnt = summary ? summary.querySelector('.count') : null;
    var b = document.createElement('button');
    b.className = 'railbtn'; b.type = 'button'; b.setAttribute('role', 'tab');
    b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    if (keyEl) b.setAttribute('data-key', keyEl.getAttribute('data-i18n'));
    var lbl = document.createElement('span'); lbl.className = 'lbl';
    b.appendChild(lbl);
    b.addEventListener('click', function(){ activateTab(i); });
    rail.appendChild(b);
    tabButtons.push(b);
    // repeat the title inside the section body for context
    var body = sec.querySelector('.body');
    if (body && keyEl && !sec.hasAttribute('data-notitle')){
      var h = document.createElement('div'); h.className = 'sectitle';
      var ht = document.createElement('span');
      ht.setAttribute('data-i18n', keyEl.getAttribute('data-i18n'));
      h.appendChild(ht);
      if (cnt) h.appendChild(cnt);
      body.insertBefore(h, body.firstChild);
    }
  });
  panel.insertBefore(rail, inner);
  activateTab(0);
}
function activateTab(i){
  if (typeof exitDataMode === 'function') exitDataMode();
  activeTab = i;
  tabSections.forEach(function(sec, j){ sec.style.display = j === i ? '' : 'none'; });
  tabButtons.forEach(function(b, j){ b.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
  var inner = document.querySelector('.panelinner');
  if (inner) inner.scrollTop = 0;
  if (tabSections[i] && tabSections[i].querySelector('#repSummary')) renderReportUi();
}
function syncTabLabels(){
  tabButtons.forEach(function(b){
    var key = b.getAttribute('data-key');
    var lbl = b.querySelector('.lbl');
    if (!key || !lbl) return;
    var shortKey = 'tab.' + key.split('.')[1];
    var dict = DICT[lang] || DICT.en;
    lbl.textContent = (dict[shortKey] !== undefined || DICT.en[shortKey] !== undefined) ? L(shortKey) : L(key);
  });

/* how a row variable is tabulated: skip it, a distribution (maybe with statistics), or statistics only */
/* no valid answers among the cases in use (sysmis everywhere, or only user-missing codes) */
function varIsEmpty(vv, o){
  var d = vv.data, m = state.caseMask;
  for (var i = 0; i < d.length; i++){
    if (m && !m[i]) continue;
    var x = d[i];
    if (T.isSysmis(x)) continue;
    if (!o.includeMissing && T.userMissing(vv, x)) continue;
    return false;
  }
  return true;
}
function itemPlan(vv, o){
  if (typeof dateKindOf === 'function' && dateKindOf(vv)) return { skip:true, why:'date' };
  if (varIsEmpty(vv, o)) return { skip:true, why:'empty' };
  var cats = T.getCategories(vv, { includeMissing:o.includeMissing }).length;
  var scaleLike = vv.type === 'numeric' && (!vv.valueLabels || !vv.valueLabels.length || vv.measure === 'scale');
  var statsOn = scaleLike && o.showMeans && o.statList.length > 0;
  var statsOnly = statsOn && (o.numMode === 'stats' || cats > 60);
  if (!statsOnly && cats > 60) return { skip:true, why:'many' };
  return { skip:false, scaleLike:scaleLike, statsOn:statsOn, statsOnly:statsOnly };
}
function moveMeasure(from, to){
  var o = state.measureOrder;
  if (from === to || from < 0 || to < 0 || from >= o.length || to >= o.length) return;
  o.splice(to, 0, o.splice(from, 1)[0]);
  renderMeasureOrder(); saveConfig(); scheduleCompute();
}
function renderMeasureOrder(){
  var box = $('measureList');
  if (!box) return;
  state.measureOrder.forEach(function(key){
    var input = $(MEASURE_IDS[key]);
    if (!input) return;
    var lab = input.parentNode;
    box.appendChild(lab);
    var g = lab.querySelector('.mgrip');
    if (!g){
      g = document.createElement('span'); g.className = 'mgrip'; g.textContent = '⠿';
      g.setAttribute('role', 'button'); g.tabIndex = 0;
      /* the handle sits inside the option's label: a click on it must not switch the option */
      g.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); });
      g.addEventListener('keydown', function(e){
        var i = state.measureOrder.indexOf(key);
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
          e.preventDefault(); moveMeasure(i, i + (e.key === 'ArrowUp' ? -1 : 1));
          try{ g.focus(); }catch(err){}
        }
      });
      lab.insertBefore(g, lab.firstChild);
    }
    var name = lab.querySelector('.ol');
    g.title = L('cells.drag'); g.setAttribute('aria-label', L('cells.drag') + (name ? ': ' + name.textContent : ''));
  });
  initMeasureDrag(box);
}
/* pointer dragging works the same for a mouse, a pen and a finger */
function initMeasureDrag(box){
  if (box.__drag) return;
  box.__drag = true;
  box.addEventListener('pointerdown', function(e){
    var g = e.target.closest && e.target.closest('.mgrip'); if (!g) return;
    e.preventDefault();
    var row = g.parentNode, rows = Array.prototype.slice.call(box.querySelectorAll('.opt'));
    var from = rows.indexOf(row), to = from;
    var clear = function(){ rows.forEach(function(r){ r.classList.remove('dropmark', 'dropafter'); }); };
    row.classList.add('dragging');
    try{ g.setPointerCapture(e.pointerId); }catch(err){}
    var move = function(ev){
      var n = 0;
      rows.forEach(function(r){ var rc = r.getBoundingClientRect(); if (ev.clientY > rc.top + rc.height / 2) n++; });
      to = n > from ? n - 1 : n;
      clear();
      if (to !== from) rows[to].classList.add(to > from ? 'dropafter' : 'dropmark');
    };
    var up = function(){
      g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
      row.classList.remove('dragging'); clear();
      if (to !== from) moveMeasure(from, to);
    };
    g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
  });
}

/* ---------------- file loading ---------------- */
function handleFile(file){
  if (!file) return;
  if (!/\.(sav|zsav)$/i.test(file.name)) { toast(L('toast.needSav')); return; }
  status(L('status.reading'), true);
  var fr = new FileReader();
  fr.onerror = function(){ status(P().readError, false, true); };
  fr.onload = function(){
    parseSavInBackground(fr.result, function(p){ status(L('status.reading'), true, false, Math.round(p * 100)); })
      .then(function(data){
        state.data = data;
        state.fileName = file.name;
        state.vars = state.data.variables.filter(function(v){ return v.data && v.data.length; });
        afterLoad();
      }).catch(function(err){
        console.error(err);
        status(P().parseError(err && err.message ? err.message : err), false, true);
      });
  };
  fr.readAsArrayBuffer(file);
}

    $('preview').innerHTML = '';
    var e = document.createElement('div'); e.className = 'empty-preview'; e.textContent = L('preview.empty');
    $('preview').appendChild(e);
    updateTocButton();
    $('btnWord').disabled = true; $('btnExcel').disabled = true;
    status('', false);
    return;
  }
  state.computing = true;
  $('btnWord').disabled = true; $('btnExcel').disabled = true;

  var banner = bannerFor(bannerNames('preview'), o);
  var models = [], i = 0, tooMany = {};
  status(L('status.computing'), true, false, 0);

  function step(){
    var t0 = Date.now();
    while (i < items.length && Date.now() - t0 < 80){
      var it = items[i++];
      try{
        var m = buildJobModel(banner, it, o, tooMany);
        if (m) models.push(m);
      }catch(err){ console.error('table error', err); }
    }
    status(L('status.computing'), true, false, Math.round(100*i/items.length));
    if (i < items.length) setTimeout(step, 0);
    else {
      state.models = attachOpens(models); state.computing = false;
      var msg = P().ready(models.length);
      var few = function(list){ return list.slice(0,6).join(', ') + (list.length > 6 ? '…' : ''); };
      if (tooMany.many) msg += P().skipped(few(tooMany.many), 60);
      if (tooMany.date) msg += P().skippedDate(few(tooMany.date));
      if (tooMany.empty) msg += P().skippedEmpty(few(tooMany.empty));
      status(msg, false, !!(tooMany.many || tooMany.date || tooMany.empty));
      renderPreview();
    }
  }
  setTimeout(step, 0);
}
