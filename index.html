var WORD_MAX_COLS = 16;   /* data columns (Total included) that fit across a landscape page */
function wordColumnCount(){
  var o = readOpts();
  var cats = 1;   // the Total column
  bannerNames('word').forEach(function(nm){
    var v = findVar(nm);
    if (v) cats += T.getCategories(v, { includeMissing:o.includeMissing }).length;
  });
  return cats * (o.measures.length || 1);
}
function wordFits(){ return wordColumnCount() <= WORD_MAX_COLS; }
function splitWord(){ var el = $('optSplitWord'); return !!(el && el.checked); }
/* break the banner into groups that each fit a landscape A4 page */
function wordBannerGroups(){
  var o = readOpts(), per = o.measures.length || 1;
  var names = bannerNames('all');
  var groups = [], cur = [], cols = per;   // the Total column
  names.forEach(function(nm){
    var v = findVar(nm); if (!v) return;
    var c = bannerCatCount(v) * per;
    if (cur.length && cols + c > WORD_MAX_COLS){ groups.push(cur); cur = []; cols = per; }
    cur.push(nm); cols += c;
  });
  if (cur.length) groups.push(cur);
  return groups.length ? groups : [[]];
}
/* a banner variable so wide that even alone it cannot fit */
function widestBannerVar(){
  var o = readOpts(), per = o.measures.length || 1, worst = null;
  bannerNames('all').forEach(function(nm){
    var v = findVar(nm); if (!v) return;
    var cols = (bannerCatCount(v) + 1) * per;
    if (cols > WORD_MAX_COLS && (!worst || cols > worst.cols)) worst = { name: v.label || v.name, cols: cols };
  });
  return worst;
}
function updateExportState(){
  var n = state.models.length;
  var natural = wordFits();
  var worst = widestBannerVar();
  var fits = natural || (splitWord() && !worst);
  var tip = '';
  if (!natural && splitWord() && worst) tip = P().wordOneTooWide(worst.name, worst.cols, WORD_MAX_COLS);
  else if (!natural && splitWord()) tip = P().wordSplitTip(wordBannerGroups().length);
  else if (!natural) tip = P().wordTooWide(wordColumnCount(), WORD_MAX_COLS);
  var wrap = $('splitWrap'), hint = $('splitHint');
  if (wrap){
    var showSplit = !natural || splitWord();
    wrap.style.display = showSplit ? '' : 'none';
    if (hint) hint.style.display = showSplit ? '' : 'none';
  }
  $('btnWord').disabled = !n || !fits;
  $('btnWord').title = tip;
  $('btnExcel').disabled = !n;

function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function(c){

function applyStickyCols(wrap){
  var tbl = wrap.querySelector('table.ct');
  if (!tbl) return;
  var limit = 1 + (readOpts().measures.length || 1);   // label column + the Total sub-columns
  var rows = Array.prototype.slice.call(tbl.querySelectorAll('tr'));
  rows.forEach(function(tr){
    Array.prototype.forEach.call(tr.children, function(c){
      c.classList.remove('stickycol'); c.classList.remove('stickyedge'); c.style.left = '';
    });
  });
  var base = tbl.getBoundingClientRect().left;
  var plan = rows.map(function(tr){
    var acc = 0, list = [];
    for (var i = 0; i < tr.children.length && acc < limit; i++){
      var c = tr.children[i];
      list.push({ el: c, left: Math.round(c.getBoundingClientRect().left - base) });
      acc += (c.colSpan || 1);
    }
    return list;
  });
  plan.forEach(function(list){
    list.forEach(function(item, idx){
      item.el.classList.add('stickycol');
      item.el.style.left = item.left + 'px';
      if (idx === list.length - 1) item.el.classList.add('stickyedge');
    });
  });
}

    var sc = wrap.querySelector('.scroll');

    if (sc) sc.scrollLeft = keep;

/* models for an export: Word may repeat every table once per banner part */
function exportModels(kind, o, onlyKey){
  if (kind !== 'word' || wordFits() || !splitWord()){
    var names = bannerNames('all');
    var flat = computeModelsSync(names, o, onlyKey);
    return { models: flat, names: names, parts: 1 };
  }
  var groups = wordBannerGroups();
  var perGroup = groups.map(function(g){ return computeModelsSync(g, o, onlyKey); });
  var out = [];
  var count = perGroup.length ? perGroup[0].length : 0;
  for (var i = 0; i < count; i++){
    for (var g = 0; g < perGroup.length; g++){
      var m = perGroup[g][i];
      if (!m) continue;
      if (groups.length > 1) m.title = m.title + ' — ' + P().wordPart(g + 1, groups.length);
      out.push(m);
    }
  }
  return { models: out, names: bannerNames('all'), parts: groups.length };
}

/* actual (unweighted) number of cases in each category, among the cases in use: for progress bars */

    if (!r.id) r.id = 'a' + Math.random().toString(36).slice(2, 10);

function authorTabOrder(){

  (state.report.tabOrder || []).forEach(function(k){ if ((k === 'main' || ids.indexOf(k) >= 0) && out.indexOf(k) < 0) out.push(k); });
  if (out.indexOf('main') < 0) out.unshift('main');
  ids.forEach(function(id){ if (out.indexOf(id) < 0) out.push(id); });

function authorMissing(){

  var miss = 0, has = function(x){ return (x.v && names[x.v]) || (x.t && titles[x.t]); };

      else if (it.k === 'g' && it.src === 'table'){ if (!has(it)) miss++; }

function saveSav(){
  if (!state.data) return;
  var withMods = $('savMods').checked;
  var list = state.vars.filter(function(v){ return withMods || !v.__mod; });
  /* deleted cases are left out of the file */
  var keep = activeCaseIndexes(), all = keep.length === state.data.header.nCases;
  var pick = function(d){ if (all) return d; var o = new Array(keep.length); for (var k = 0; k < keep.length; k++) o[k] = d[keep[k]]; return o; };
  var vars = list.map(function(v){
    return { name:v.name, label:v.label, type:v.type, width:v.width, data:pick(v.data), valueLabels:v.valueLabels,
      nMiss:v.nMiss, missVals:v.missVals, measure:v.measure, printFmt:v.printFmt, decimals:v.decimals };
  });
  var sets = state.mrSets.map(function(s, k){ return { label:s.name, kind:s.kind, counted:s.counted, varNames:s.varNames, setName:'MRSET' + (k + 1) }; });
  status(L('sav.building'), true, false, 40);
  setTimeout(function(){
    try{
      var res = SavWriter.write({ vars:vars, nCases:keep.length, weightName:state.weightName, mrSets:sets,
                                  fileLabel: state.data.header.fileLabel || '' });
      status('', false);
      var fn = baseName() + '_edited.sav';
      saveFile(new Blob([res.bytes], { type:'application/octet-stream' }), fn).then(function(){
        if (res.truncated.length) toast(P().savTrunc(res.truncated.join(', ')));
      });
    }catch(err){ console.error(err); status(P().savFail(err.message || err), false, true); }
  }, 20);
}

function initDataState(){
  var n = state.data ? state.data.header.nCases : 0;
  state.deleted = new Uint8Array(n);
  state.caseMask = null; T.setCaseMask(null);
  state.dataLog = [];
  state.idName = detectIdVar();
  var sb = $('btnSav'); if (sb) sb.disabled = !state.data;
  updateExportDataBox();
  DV.grid = null; DV.view = null; DV.query = '';
  var host = $('dvGrid'); if (host) host.innerHTML = '';
}
function detectIdVar(){
  var vars = state.vars.filter(function(v){ return !v.__mod; });
  var unique = function(v){
    var seen = Object.create(null), d = v.data;
    for (var i = 0; i < d.length; i++){ var x = d[i]; if (T.isSysmis(x)) return false; var k = String(x); if (seen[k]) return false; seen[k] = 1; }
    return d.length > 0;
  };
  var re = /^(id|_id|resp(ondent)?_?id|respid|resp|resp_?no|caseid|case_?id|interview_?id|int_?id|intid|record(_?id)?|serial|uid|questionnaire(_?id)?|anketa|n_?anketa|nomer|num|number|№)$/i;
  var named = vars.filter(function(v){ return re.test(v.name); });
  for (var a = 0; a < named.length; a++) if (unique(named[a])) return named[a].name;
  var loose = vars.filter(function(v){ return /(^|_)id($|_)|^id/i.test(v.name); });
  for (var b = 0; b < loose.length; b++) if (unique(loose[b])) return loose[b].name;
  for (var c = 0; c < Math.min(5, vars.length); c++) if (vars[c].name !== state.weightName && unique(vars[c])) return vars[c].name;
  return '';
}
function deletedCount(){ var d = state.deleted, n = 0; if (!d) return 0; for (var i = 0; i < d.length; i++) n += d[i]; return n; }
function rebuildMask(){
  var d = state.deleted, n = deletedCount();
  if (!n){ state.caseMask = null; T.setCaseMask(null); return; }
  var m = new Uint8Array(d.length);
  for (var i = 0; i < d.length; i++) m[i] = d[i] ? 0 : 1;
  state.caseMask = m; T.setCaseMask(m);
}
function activeCaseIndexes(){
  var n = state.data ? state.data.header.nCases : 0, out = [];
  for (var i = 0; i < n; i++) if (!state.deleted || !state.deleted[i]) out.push(i);
  return out;
}
function sameVal(a, b){ var ea = T.isSysmis(a), eb = T.isSysmis(b); return ea || eb ? ea === eb : a === b; }
function idText(i){
  var v = state.idName ? findVar(state.idName) : null;
  if (!v) return '#' + (i + 1);
  var x = v.data[i];
  return T.isSysmis(x) ? '#' + (i + 1) : String(x);
}
function dateKindOf(v){ return v && v.type === 'numeric' && v.printFmt ? DataGrid.dateKindOfFormat(v.printFmt) : ''; }
function valText(v, x, withLabel){
  if (T.isSysmis(x)) return '';
  var dk = dateKindOf(v); if (dk) return DataGrid.dateText(dk, x);
  var s = typeof x === 'number' ? (Number.isInteger(x) ? String(x) : String(Math.round(x * 1e6) / 1e6)) : String(x);
  if (!withLabel || !v.valueLabels) return s;
  var p = v.valueLabels.filter(function(q){ return String(q.value) === String(x); })[0];
  return p ? s + ' ' + p.label : s;
}
function labelOf(v, x){
  if (T.isSysmis(x) || !v.valueLabels) return '';
  var p = v.valueLabels.filter(function(q){ return String(q.value) === String(x); })[0];
  return p ? p.label : '';
}

/* every change to the data goes through here: weights, Mod variables and tables follow */
function afterDataChange(varName){
  if (varName && varName === state.weightName) applyWeight();
  if (varName) state.vars.forEach(function(dv){
    if (dv.__mod && dv.__src === varName){
      var m = modById(dv.__mod), fresh = m ? materialize(m) : null;
      /* in place: the grid and the tables keep a reference to this array */
      if (fresh) for (var k = 0; k < fresh.data.length; k++) dv.data[k] = fresh.data[k];
    }
  });
  if (varName && varName === state.idName && DV.grid) DV.grid.relayout();
  rebuildMask();
  renderFileInfo(); renderDataNotes();
  if (DV.grid){ if (varName) DV.grid.refresh(); updateDvStats(); }
  renderDvLog(); updateDvButtons();
  scheduleCompute();
}
function editCell(i, col, value){
  var v = findVar(col.key); if (!v || v.__mod) return DT('readonly');
  var old = v.data[i];
  if (v.type === 'string' && typeof value === 'number') value = isNaN(value) ? '' : String(value);
  if (sameVal(old, value)) return true;
  v.data[i] = value;
  state.dataLog.push({ k:'edit', i:i, v:v.name, old:old, nw:value, at:Date.now() });
  if (v.type === 'numeric' && !T.isSysmis(value) && v.valueLabels && v.valueLabels.length && !labelOf(v, value))
    toast(DT('codeNoLabel').replace('{c}', valText(v, value)));
  afterDataChange(v.name);
  return true;
}
function toggleDelete(i){
  var on = !state.deleted[i];
  state.deleted[i] = on ? 1 : 0;
  state.dataLog.push({ k:'del', i:i, on:on, at:Date.now() });
  afterDataChange(null);
  if (DV.grid){ if (!DV.showDel) DV.grid.setShowDeleted(false); else DV.grid.refresh(); }
}
function undoEntry(idx){
  var log = state.dataLog, e = log[idx]; if (!e) return;
  if (e.k === 'edit'){
    var v = findVar(e.v); if (v) v.data[e.i] = e.old;
    for (var j = log.length - 1; j > idx; j--) if (log[j].k === 'edit' && log[j].i === e.i && log[j].v === e.v) log.splice(j, 1);
    log.splice(idx, 1);
    afterDataChange(e.v);
  } else {
    state.deleted[e.i] = e.on ? 0 : 1;
    for (var k = log.length - 1; k > idx; k--) if (log[k].k === 'del' && log[k].i === e.i) log.splice(k, 1);
    log.splice(idx, 1);
    afterDataChange(null);
    if (DV.grid) DV.grid.refresh();
  }
  toast(DT('undone'));
}
function undoLast(){ if (!state.dataLog.length){ toast(DT('nothing')); return; } undoEntry(state.dataLog.length - 1); }

  if (!idv) return { noId: true };
  var net = {}, order = [];
  state.dataLog.forEach(function(e){
    if (e.k !== 'edit') return;
    var key = e.i + '\u0001' + e.v;
    if (!net[key]){ net[key] = { i:e.i, v:e.v, old:e.old }; order.push(key); }
    net[key].nw = e.nw;
  });
  var j = function(x){ return T.isSysmis(x) ? null : x; };
  var edits = order.map(function(k){ return net[k]; }).filter(function(x){ return !sameVal(x.old, x.nw); })
    .map(function(x){ return { id: j(idv.data[x.i]), v: x.v, old: j(x.old), nw: j(x.nw) }; });
  var deleted = [];
  for (var i = 0; i < state.deleted.length; i++) if (state.deleted[i]) deleted.push(j(idv.data[i]));
  if (!edits.length && !deleted.length) return null;
  return { idVar: idv.name, edits: edits, deleted: deleted };
}
function applyConfigDataEdits(de){
  if (!de || de.noId || !state.data) return;
  var idv = findVar(de.idVar);
  var md = openModal(DT('ceTitle'), false), lines = [];
  var done = function(){
    lines.forEach(function(l){ md.body.appendChild(mkEl('p', l.cls || '', l.t)); });
    if (applied || delApplied){
      md.body.appendChild(mkEl('p', 'mini', DT('ceHint')));
      md.foot.appendChild(mkBtn(DT('ceOpenLog'), '', function(){ md.close(); enterDataMode(); DV.logOpen = true; $('dvLog').hidden = false; renderDvLog(); }));
    }
    md.foot.appendChild(mkBtn(DT('ceClose'), 'primary', md.close));
  };
  var applied = 0, already = 0, conflicts = [], missing = 0, noVar = 0, delApplied = 0, delAlready = 0;
  if (!idv){ lines.push({ t: DT('ceNoVar').replace('{v}', de.idVar) }); done(); return; }
  var byId = Object.create(null);
  for (var i = 0; i < idv.data.length; i++){ var x = idv.data[i]; if (!T.isSysmis(x)) byId[String(x)] = i; }
  var val = function(x){ return x === null || x === undefined ? NaN : x; };
  var changed = {};
  (de.edits || []).forEach(function(e){
    var ci = byId[String(e.id)];
    if (ci === undefined){ missing++; return; }
    var v = findVar(e.v);
    if (!v || v.__mod){ noVar++; return; }
    var cur = v.data[ci], old = val(e.old), nw = val(e.nw);
    if (v.type === 'string'){ old = old === null || (typeof old === 'number' && isNaN(old)) ? '' : old; nw = (typeof nw === 'number' && isNaN(nw)) ? '' : nw; }
    if (sameVal(cur, nw)){ already++; return; }
    if (!sameVal(cur, old)){ conflicts.push({ id:e.id, v:v, cur:cur, old:old, nw:nw }); return; }
    v.data[ci] = nw;
    state.dataLog.push({ k:'edit', i:ci, v:v.name, old:cur, nw:nw, at:Date.now() });
    changed[v.name] = 1; applied++;
  });
  (de.deleted || []).forEach(function(id){
    var ci = byId[String(id)];
    if (ci === undefined){ delAlready++; return; }   /* a dataset saved after the deletion no longer has the case */
    if (state.deleted[ci]){ delAlready++; return; }
    state.deleted[ci] = 1; state.dataLog.push({ k:'del', i:ci, on:true, at:Date.now() }); delApplied++;
  });
  state.idName = idv.name;
  Object.keys(changed).forEach(function(n){ afterDataChange(n); });
  afterDataChange(null);
  if (DV.grid){ DV.grid.setColumns(gridColumns()); }
  var total = (de.edits || []).length + (de.deleted || []).length;
  if (!applied && !delApplied && !conflicts.length && !missing && !noVar) lines.push({ t: DT('ceAll').replace('{n}', total) });
  else {
    if (applied) lines.push({ t: DT('ceApplied').replace('{n}', applied) });
    if (delApplied) lines.push({ t: DT('ceDel').replace('{n}', delApplied) });
    if (already + delAlready) lines.push({ t: DT('ceAlready').replace('{n}', already + delAlready) });
    if (conflicts.length){
      lines.push({ t: DT('ceConflict').replace('{n}', conflicts.length), cls:'cewarn' });
      conflicts.slice(0, 8).forEach(function(c){
        lines.push({ cls:'mini', t: DT('ceRow').replace('{id}', c.id).replace('{v}', c.v.name)
          .replace('{cur}', valText(c.v, c.cur, true) || DT('empty')).replace('{old}', valText(c.v, c.old, true) || DT('empty'))
          .replace('{nw}', valText(c.v, c.nw, true) || DT('empty')) });
      });
    }
    if (missing) lines.push({ t: DT('ceMissing').replace('{n}', missing), cls:'cewarn' });
    if (noVar) lines.push({ t: DT('ceNoVarCol').replace('{n}', noVar), cls:'cewarn' });
  }
  done();
}

/* ---- heavy work in a background thread ----
   The worker is built from the page's own scripts. If the browser or the hosting page does not allow
   a background thread, every task runs in the page as before. */
var BG = { ok: null };
var BG_PARSE = "self.onmessage=function(e){try{var r=SavReader.parse(e.data.buf,{onProgress:function(p){self.postMessage({type:'progress',p:p});}});" +
  "self.postMessage({type:'done',result:r});}catch(err){self.postMessage({type:'error',message:String(err&&err.message||err)});}};self.postMessage({type:'ready'});";
var BG_XLSX = "self.onmessage=function(e){var o=e.data;o.onProgress=function(p){self.postMessage({type:'progress',p:p});};" +
  "DataXlsx.build(o).then(function(b){self.postMessage({type:'done',result:b});},function(err){self.postMessage({type:'error',message:String(err&&err.message||err)});});};" +
  "self.postMessage({type:'ready'});";
function runBg(ids, glue, msg, onProgress){
  return new Promise(function(resolve, reject){
    if (BG.ok === false || typeof Worker === 'undefined' || typeof Blob === 'undefined'){ reject({ fallback:true }); return; }
    var w, ready = false, url;
    try{
      var src = ids.map(function(id){ var el = document.getElementById(id); return el ? el.textContent : ''; }).join('\n;\n') + '\n;\n' + glue;
      url = URL.createObjectURL(new Blob([src], { type:'text/javascript' }));
      w = new Worker(url);
    }catch(e){ BG.ok = false; reject({ fallback:true }); return; }
    var finish = function(){ try{ w.terminate(); }catch(e){} try{ URL.revokeObjectURL(url); }catch(e){} };
    var timer = setTimeout(function(){ if (!ready){ BG.ok = false; finish(); reject({ fallback:true }); } }, 3000);
    w.onerror = function(e){ clearTimeout(timer); if (e && e.preventDefault) e.preventDefault(); if (!ready) BG.ok = false; finish(); reject({ fallback:true }); };
    w.onmessage = function(e){
      var m = e.data || {};
      if (m.type === 'ready'){ ready = true; clearTimeout(timer); BG.ok = true; try{ w.postMessage(msg); }catch(err){ finish(); reject({ fallback:true }); } return; }
      if (m.type === 'progress'){ if (onProgress) onProgress(m.p); return; }
      if (m.type === 'done'){ finish(); resolve(m.result); return; }
      finish(); reject({ fallback:true, error:m.message });
    };
  });
}
/* read a .sav/.zsav: in the background with progress, or in the page */
function parseSavInBackground(buf, onProgress){
  return runBg(['src-inflate', 'src-reader'], BG_PARSE, { buf: buf }, onProgress).catch(function(){
    return new Promise(function(resolve, reject){ setTimeout(function(){ try{ resolve(S.parse(buf, {})); }catch(err){ reject(err); } }, 10); });
  });
}

/* ---- Excel ---- */
function dictFields(v){
  var labs = (v.valueLabels || []).map(function(p){ return valText(v, p.value) + ' = ' + p.label; }).join('\n');
  var miss = '';
  var r = v.missingRule;
  if (r){
    var parts = (r.discrete || []).map(function(x){ return String(x); });
    if (r.lo !== null && r.lo !== undefined) parts.unshift((r.lo <= -1e300 ? 'LO' : r.lo) + '–' + (r.hi >= 1e300 ? 'HI' : r.hi));
    miss = parts.join('; ');
  }
  return {
    dictType: v.type === 'string' ? DT('tStr').replace('{w}', v.width || '') : dateKindOf(v) ? DT(dateKindOf(v) === 'time' ? 'tTime' : 'tDate') : DT('tNum'),
    dictLabels: labs, dictMissing: miss, dictNote: v.__mod ? DT('modNote').replace('{s}', v.__src) : ''
  };
}

function buildLogRows(){
  var out = { header:[DT('lNo'), DT('lTime'), DT('lId'), DT('lRow'), DT('lVar'), DT('lOld'), DT('lOldL'), DT('lNew'), DT('lNewL'), DT('lAct')],
              widths:[6, 18, 12, 10, 14, 10, 26, 10, 26, 18], rows:[] };

function saveDataXlsx(){
  var X = DV.xopt;
  if (!window.JSZip){ toast(L('toast.nozip')); return; }
  status(DT('xBuilding'), true, false, 40);
  setTimeout(function(){
    try{
      var list = state.vars.filter(function(v){ return X.mods || !v.__mod; });
      var vars = list.map(function(v){
        var labels = null;
        if (v.valueLabels && v.valueLabels.length){ labels = {}; v.valueLabels.forEach(function(p){ labels[String(p.value)] = p.label; }); }
        return Object.assign({ name:v.name, label:v.label || '', type:v.type, data:v.data, labels:labels, dateKind: dateKindOf(v) }, dictFields(v));
      });
      var idIndex = -1; list.forEach(function(v, i){ if (v.name === state.idName) idIndex = i; });
      var logRows = X.log && state.dataLog.length ? buildLogRows() : null;
      var xopts = {
        rows: activeCaseIndexes(), vars: vars, idIndex: idIndex,
        sheets: { codes: X.sheets !== 'labels', labels: X.sheets !== 'codes' },
        dict: !!X.dict, log: logRows, title: baseName(),
        names: { codes: DT('xSheetCodes'), labels: DT('xSheetLabels'), dict: DT('xSheetDict'), log: DT('xSheetLog') },
        dictHeader: [DT('dName'), DT('dLabel'), DT('dType'), DT('dLabels'), DT('dMissing'), DT('dNote')]
      };
      runBg(['rep-zip', 'src-dxlsx'], BG_XLSX, xopts, function(p){ status(DT('xBuilding'), true, false, Math.round(p * 100)); })
        .catch(function(){ return DataXlsx.build(xopts); })
        .then(function(blob){
          status('', false);
          return saveFile(blob, baseName() + '_data.xlsx');
        }).catch(function(err){ console.error(err); status(DT('xFail') + (err.message || err), false, true); });
    }catch(err){ console.error(err); status(DT('xFail') + (err.message || err), false, true); }
  }, 20);
}

/* keep the wheel inside the panel it hovers over */
(function(){
  var panel = document.querySelector('.panel');
  if (!panel) return;
  function scrollableUnder(el){
    while (el && el !== panel){
      if (el.scrollHeight > el.clientHeight + 1){
        var st = window.getComputedStyle(el);
        if (/(auto|scroll)/.test(st.overflowY)) return el;
      }
      el = el.parentElement;
    }
    var inner = document.querySelector('.panelinner');
    return (inner && inner.scrollHeight > inner.clientHeight + 1) ? inner : null;
  }
  panel.addEventListener('wheel', function(e){
    if (window.innerWidth <= 860) return;
    var box = scrollableUnder(e.target);
    if (box) box.scrollTop += e.deltaY;
    e.preventDefault();
  }, { passive: false });
})();

/* panel resizing */
(function(){
  var resizer = $('resizer'), dragging = false;
  var DEFAULT_W = 380;
  try{
    var savedW = parseInt(localStorage.getItem('spss-ctab-panelw'), 10);
    if (savedW >= 300 && savedW <= 760) document.documentElement.style.setProperty('--panel-w', savedW + 'px');
  }catch(e){}
  function setW(px){
    var w = Math.max(300, Math.min(760, Math.round(px)));
    document.documentElement.style.setProperty('--panel-w', w + 'px');
    try{ localStorage.setItem('spss-ctab-panelw', String(w)); }catch(e){}
  }
  resizer.addEventListener('pointerdown', function(e){
    dragging = true; resizer.classList.add('dragging'); document.body.classList.add('resizing');
    try{ resizer.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  resizer.addEventListener('pointermove', function(e){ if (dragging) setW(e.clientX); });
  function stop(e){
    if (!dragging) return;
    dragging = false; resizer.classList.remove('dragging'); document.body.classList.remove('resizing');
    try{ resizer.releasePointerCapture(e.pointerId); }catch(err){}
  }
  resizer.addEventListener('pointerup', stop);
  resizer.addEventListener('pointercancel', stop);
  resizer.addEventListener('dblclick', function(){ setW(DEFAULT_W); });
})();
