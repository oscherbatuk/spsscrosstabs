<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPSS Crosstabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF0F4; --rule:#D4D9E2; --rule-soft:#E4E8EE;
  --ink:#141A22; --ink-2:#4B5563; --muted:#5F6874;
  --accent:#0E5C72; --accent-ink:#FFFFFF; --accent-soft:#DCEBF0;
  --sig:#8E2438; --low:#8A9199; --warn:#8A5A00; --warn-bg:#FBF3E2;
  --shadow:0 1px 2px rgba(20,26,34,.06);
  --row-hover:#E7EEF3; --row-hover-tot:#C3DCE8; --sec-tint:#EDF2F8; --seg-on:#FFFFFF;
  --mono-nums:"IBM Plex Sans",system-ui,sans-serif;
}
:root:not([data-theme="light"]){ color-scheme: light; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141A; --surface:#171C24; --surface-2:#1E242D; --rule:#2C3542; --rule-soft:#232A34;
    --ink:#E7EBF1; --ink-2:#B6BECA; --muted:#8A94A2;
    --accent:#4FAFC9; --accent-ink:#0B1116; --accent-soft:#17323B;
    --sig:#E2879A; --low:#767F8C; --warn:#E3B765; --warn-bg:#2A2315;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --row-hover:#212A34; --row-hover-tot:#20414C; --sec-tint:#1C232C; --seg-on:#2C3846;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141A; --surface:#171C24; --surface-2:#1E242D; --rule:#2C3542; --rule-soft:#232A34;
  --ink:#E7EBF1; --ink-2:#B6BECA; --muted:#8A94A2;
  --accent:#4FAFC9; --accent-ink:#0B1116; --accent-soft:#17323B;
  --sig:#E2879A; --low:#767F8C; --warn:#E3B765; --warn-bg:#2A2315;
  --row-hover:#212A34; --row-hover-tot:#20414C; --sec-tint:#1C232C; --seg-on:#2C3846;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  display:flex; flex-direction:column; height:100%; overflow:hidden;
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.45; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:Literata,Georgia,"Times New Roman",serif; font-weight:600; margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* ---------- top bar ---------- */
.bar{
  flex:0 0 auto; z-index:40; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center;
  padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--rule);
}
.bar h1{font-size:16px; letter-spacing:-.01em; white-space:nowrap}
.bar .sub{color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar .ver{color:var(--muted); font-size:11px; white-space:nowrap; letter-spacing:.02em; align-self:center}
.bar .spacer{flex:1}
/* the right-hand buttons stay together and move to a second row when the bar is too narrow */
.barR{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end; margin-left:auto}
.bar .btn{flex:0 0 auto}
/* the file and its settings: one group in the bar */
.filegrp{display:inline-flex; align-items:center; gap:2px; padding:2px; border:1px solid var(--rule); border-radius:8px; background:var(--surface-2)}
.filegrp .btn{border-color:transparent; background:transparent; box-shadow:none}
.filegrp .btn:hover:not(:disabled){background:var(--surface); border-color:var(--rule)}
.fgsep{width:1px; align-self:stretch; margin:3px 4px; background:var(--rule)}
.fglbl{font-size:11.5px; color:var(--muted); padding:0 2px 0 4px; white-space:nowrap}
#cfgSave{position:relative}
#cfgSave .dirtydot{display:none; position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%;
  background:#F59E0B; box-shadow:0 0 0 2px var(--surface-2)}
#cfgSave.dirty{color:var(--accent); font-weight:600; background:var(--surface); border-color:#F59E0B}
#cfgSave.dirty .dirtydot{display:block}
@media (max-width:900px){ .fglbl{display:none} }
@media (max-width:1200px){ .bar .ver{display:none} }
.btn{
  border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  border-radius:4px; padding:7px 12px; font-size:13px; font-weight:500;
}
.btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08); color:var(--accent-ink)}
.bar .btn{white-space:nowrap}
.btn.word{background:#185ABD; color:#fff; border-color:#185ABD}
.btn.word:hover:not(:disabled){background:#1148A0; border-color:#1148A0; color:#fff}
.btn.excel{background:#107C41; color:#fff; border-color:#107C41}
.btn.excel:hover:not(:disabled){background:#0C6435; border-color:#0C6435; color:#fff}
.btn.small{padding:3px 8px; font-size:12px}
label.btn{display:inline-block; cursor:pointer; user-select:none; -webkit-user-select:none}
textarea,input[type=password]{width:100%; padding:6px 8px; border:1px solid var(--rule); border-radius:4px; background:var(--surface); font:inherit; color:inherit}
textarea{resize:vertical; min-height:72px; line-height:1.4}
.palrow{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px}
.palbtn{display:flex; flex-direction:column; gap:5px; align-items:stretch; padding:7px 8px; border:1px solid var(--rule);
  border-radius:5px; background:var(--surface); font-size:12px; text-align:left}
.palbtn .strip{display:flex; height:12px; border-radius:3px; overflow:hidden}
.palbtn .strip i{flex:1}
.palbtn[aria-pressed="true"]{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
.logolist{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 8px}
.logolist:empty{display:none}
.logoitem{display:flex; align-items:center; gap:4px; border:1px solid var(--rule); border-radius:5px; padding:4px 4px 4px 8px; background:#fff}
.logoitem img{display:block; max-height:36px; max-width:120px; object-fit:contain}
.logoitem button{border:0; background:none; color:var(--muted); font-size:12px; padding:0 4px; line-height:1.4}
.logoitem button:hover:not(:disabled){color:var(--accent)}
.logoitem button.rm:hover{color:var(--sig)}
.logoitem button:disabled{opacity:.3}
.repsum{font-size:12px; color:var(--ink-2); background:var(--surface-2); border-radius:4px; padding:8px 10px; margin:4px 0 12px; line-height:1.45}
.vh{position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); clip-path:inset(50%); white-space:nowrap; border:0; opacity:0}
.btn.icon{padding:3px 7px; font-size:12px; line-height:1.2}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- empty state ---------- */
.intro{max-width:720px; margin:0 auto; padding:56px 20px 80px; flex:1 1 auto; overflow-y:auto; width:100%}
.intro h2{font-size:30px; line-height:1.15; letter-spacing:-.02em; margin-bottom:14px}
.intro p{color:var(--ink-2); margin:0 0 22px; max-width:56ch}
.drop{
  border:1.5px dashed var(--rule); border-radius:6px; background:var(--surface);
  padding:34px 24px; text-align:center; transition:border-color .15s, background .15s;
}
.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.drop .hint{color:var(--muted); font-size:12.5px; margin-top:10px}
.facts{margin:30px 0 0; padding:0; list-style:none; border-top:1px solid var(--rule-soft)}
.facts li{padding:11px 0 11px 0; border-bottom:1px solid var(--rule-soft); color:var(--ink-2); font-size:13px}
.facts b{color:var(--ink); font-weight:600}

/* ---------- workspace ---------- */
.work{display:none; grid-template-columns:var(--panel-w, 380px) 1fr; align-items:stretch}
.work.on{display:grid; flex:1 1 auto; min-height:0; overflow:hidden}
.panel{
  height:100%; overflow:hidden; background:var(--surface);
  display:grid; grid-template-columns:minmax(0,1fr) 7px; grid-template-rows:auto minmax(0,1fr);
}
.panelinner{grid-column:1; grid-row:2; min-width:0; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:0 0 40px}
.resizer{
  grid-column:2; grid-row:1 / span 2; cursor:col-resize; border-left:1px solid var(--rule); background:var(--surface);
  touch-action:none; position:relative;
}
.resizer::after{
  content:""; position:absolute; top:50%; left:2px; width:3px; height:34px; margin-top:-17px;
  border-radius:2px; background:var(--rule);
}
.resizer:hover::after,.resizer.dragging::after{background:var(--accent)}
body.resizing{user-select:none; cursor:col-resize}
.view{padding:18px 20px 80px; min-width:0; height:100%; overflow-y:auto; overscroll-behavior:contain}
.sec{border-bottom:0; background:var(--surface)}
.panelinner .sec>summary{display:none}
/* the panel's tabs: one row, two when the panel is narrow */
.rail{
  grid-column:1; grid-row:1; display:flex; flex-wrap:wrap; gap:0 1px; padding:6px 8px 0;
  border-bottom:1px solid var(--rule); background:var(--surface);
}
.railbtn{
  border:0; border-bottom:2px solid transparent; margin-bottom:-1px; background:none; border-radius:4px 4px 0 0;
  font-size:13px; line-height:1.2; color:var(--ink-2); padding:8px 7px 9px; white-space:nowrap;
}
.railbtn:hover{background:var(--surface-2); color:var(--ink)}
.railbtn[aria-pressed="true"]{color:var(--accent); font-weight:600; border-bottom-color:var(--accent)}
.sectitle{display:flex; gap:8px; align-items:baseline; justify-content:space-between}
.sectitle .count{font-weight:400; font-size:11.5px; color:var(--muted)}
.sec>summary{padding:11px 16px; font-weight:600; font-size:13px; list-style:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"▸"; color:var(--muted); font-size:11px; transition:transform .12s}
.sec[open]>summary::before{transform:rotate(90deg)}
.sec>summary .count{margin-left:auto; color:var(--muted); font-weight:400; font-size:12px}
.sec .body{padding:14px 16px 24px}
.sectitle{font-size:13px; font-weight:600; margin:0 0 10px; padding:0 0 8px; border-bottom:2px solid var(--rule)}
.field{display:block; margin:0 0 11px}
.field>span{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
select,input[type=text],input[type=number]{
  width:100%; padding:6px 8px; border:1px solid var(--rule); border-radius:4px; background:var(--surface);
}
.sec .vlist,.sec .mrset,.sec .cand{background:var(--surface)}
.row-flex{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.check{display:flex; gap:8px; align-items:flex-start; margin:0 0 7px; font-size:13px; cursor:pointer}
.check input{margin:2px 0 0}
.bnrrow{padding:6px 0; border-bottom:1px solid var(--rule-soft)}
.bnrrow:last-of-type{border-bottom:0}
.bnrname{font-size:12.5px; line-height:1.3; overflow-wrap:anywhere}
.bnrctl{display:flex; gap:6px; align-items:center; justify-content:flex-end; margin-top:4px}
.bnrtog{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--ink-2); margin-right:auto; cursor:pointer}
.bnrtog input{margin:0}
.helpbtn{flex:0 0 auto; width:22px; height:22px; margin-top:6px; padding:0; border-radius:50%; border:1px solid var(--rule);
  background:var(--surface); color:var(--muted); font-size:11.5px; font-weight:600; line-height:20px; text-align:center}
.helpbtn:hover{border-color:var(--accent); color:var(--accent)}
.poptext{padding:8px 10px; border-bottom:1px solid var(--rule-soft); line-height:1.4}
.poptext:last-child{border-bottom:0}
.seg{display:inline-flex; gap:2px; padding:2px; border:1px solid var(--rule); border-radius:6px; background:var(--surface-2)}
.seg button{border:0; background:transparent; border-radius:4px; padding:4px 10px; font-size:12.5px; color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--seg-on); color:var(--accent); font-weight:600; box-shadow:0 1px 2px rgba(20,26,34,.14)}

/* variable list */
.search{margin-bottom:8px}
.vlist{max-height:46vh; overflow-y:auto; overscroll-behavior:contain; border:1px solid var(--rule-soft); border-radius:4px}
.vitem{display:flex; gap:7px; align-items:flex-start; padding:5px 7px; border-bottom:1px solid var(--rule-soft)}
.vitem:last-child{border-bottom:0}
.vitem:hover{background:var(--surface-2)}
.vitem input{margin:3px 0 0}
.vitem .txt{flex:1; min-width:0}
.vitem .nm{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.vitem .lb{font-size:12.5px; line-height:1.3; overflow-wrap:anywhere}
.vitem .glyph{
  flex:0 0 auto; width:18px; height:18px; border-radius:3px; background:var(--surface-2);
  color:var(--muted); font-size:10.5px; display:grid; place-items:center; margin-top:2px;
}
.vitem.in-banner .glyph{background:var(--accent-soft); color:var(--accent)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 6px 3px 9px;
  border:1px solid var(--rule); border-radius:4px; background:var(--surface-2); font-size:12.5px; max-width:100%;
}
.chip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chip button{border:0; background:none; color:var(--muted); padding:0 3px; font-size:13px}
.chip button:hover{color:var(--sig)}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.tab{padding:4px 10px; border:1px solid var(--rule); border-radius:4px; background:var(--surface); font-size:12.5px}
.tab[aria-pressed=true]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.mini{font-size:12px; color:var(--muted); margin:6px 0 0}
.mrset{border:1px solid var(--rule-soft); border-radius:4px; padding:8px; margin-bottom:8px; background:var(--surface-2)}
.mrset .nm{font-weight:600; font-size:12.5px}
.mrset .vs{font-size:12px; color:var(--muted); overflow-wrap:anywhere}
.cand{border:1px solid var(--rule); border-radius:5px; margin-bottom:10px; background:var(--surface); overflow:hidden}
.cand.off{opacity:.55}
.cand .top{display:flex; gap:7px; align-items:center; padding:8px 9px; background:var(--accent-soft)}
.cand .top input[type=text]{
  flex:1; min-width:80px; padding:4px 7px; font-size:13px; font-weight:600;
  background:var(--surface); border-color:var(--accent);
}
.cand .why{font-size:11.5px; color:var(--muted); padding:6px 9px 0; overflow-wrap:anywhere}
.cand .members{padding:4px 9px 8px 9px}
.candvar{
  display:flex; gap:6px; align-items:flex-start; padding:3px 0 3px 8px; font-size:12px;
  border-left:2px solid var(--accent-soft); margin-top:3px;
}
.candvar:hover{border-left-color:var(--accent)}
.candvar .ct{flex:1; min-width:0; overflow-wrap:anywhere}
.candvar .ct b{font-weight:600; color:var(--ink); font-size:12px; font-variant-numeric:tabular-nums}
.candvar .ct span{color:var(--muted)}
.candvar input{margin:3px 0 0}


/* ---------- unified side-panel controls ---------- */
.secdesc{font-size:12.5px; color:var(--ink-2); line-height:1.45; margin:0 0 12px}
.grp{padding:12px 0 6px; border-top:1px solid var(--rule-soft)}
.sectitle + .grp, .secdesc + .grp{border-top:0; padding-top:2px}
.fold>summary.grph{list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px; margin:0}
.fold>summary.grph::-webkit-details-marker{display:none}
.fold>summary.grph::before{content:"▸"; font-size:10px; transition:transform .12s}
.fold[open]>summary.grph{margin-bottom:8px}
.fold[open]>summary.grph::before{transform:rotate(90deg)}
.fold>summary.grph:hover{color:var(--ink)}
.grph{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}
.opt{display:flex; gap:10px; align-items:flex-start; padding:5px 0; margin:0 0 3px; font-size:13px; cursor:pointer}
.opt .ot{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.opt .ol{color:var(--ink); line-height:1.35}
.opt .cnt{color:var(--muted); font-size:12px}
.oh{font-size:12px; color:var(--muted); line-height:1.4}
p.oh{margin:4px 0 8px}
.opt + p.oh{margin-top:-2px}
input.swi{appearance:none; -webkit-appearance:none; flex:0 0 auto; position:relative; width:30px; height:18px; margin:0; top:1px;
  border-radius:9px; background:var(--rule); cursor:pointer; transition:background .15s}
input.swi::before{content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
  background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.28); transition:transform .15s}
input.swi:checked{background:var(--accent)}
input.swi:checked::before{transform:translateX(12px)}
input.swi:disabled{opacity:.45; cursor:not-allowed}
input.swi.sm{width:24px; height:14px; border-radius:7px; top:0}
input.swi.sm::before{width:10px; height:10px}
input.swi.sm:checked::before{transform:translateX(10px)}
.optrow{display:flex; gap:8px; align-items:flex-start}
.optrow .opt{flex:1; min-width:0}
.sub{margin:2px 0 10px 14px; padding:2px 0 2px 26px; border-left:2px solid var(--rule-soft); transition:opacity .15s}
.sub.off{opacity:.45}
.field>span:first-child{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
.field.inline{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.field.inline>span:first-child{flex:1; margin:0; font-size:13px; color:var(--ink)}
.field.inline input{flex:0 0 84px; width:84px}
.segc{display:flex; gap:2px; padding:2px; border:1px solid var(--rule); border-radius:6px; background:var(--surface-2)}
.segc button{flex:1 1 0; min-width:0; border:0; background:transparent; border-radius:4px; padding:5px 6px;
  font-size:12.5px; line-height:1.25; color:var(--ink-2); text-align:center}
.segc button:hover{color:var(--ink)}
.segc button[aria-checked="true"]{background:var(--seg-on); color:var(--accent); font-weight:600; box-shadow:0 1px 2px rgba(20,26,34,.14)}
.pills{display:flex; flex-wrap:wrap; gap:6px}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 7px; border:1px solid var(--rule); border-radius:999px;
  background:var(--surface); font-size:12.5px; cursor:pointer; user-select:none; -webkit-user-select:none}
.pill input{appearance:none; -webkit-appearance:none; width:14px; height:14px; margin:0; border:1.5px solid var(--muted);
  border-radius:50%; display:grid; place-items:center; cursor:pointer; flex:0 0 auto}
.pill input:checked{background:var(--accent); border-color:var(--accent)}
.pill input:checked::after{content:""; width:3px; height:7px; margin-top:-2px; border:solid var(--accent-ink); border-width:0 1.5px 1.5px 0; transform:rotate(45deg)}
.pill:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.measlist .opt{align-items:center}

/* ---------- section headings and analytical comments in the preview ---------- */
.pvbar{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding:8px 12px; margin:0 0 16px;
  background:var(--surface); border:1px solid var(--rule); border-radius:6px}
.pvbar .opt{padding:0; margin:0; align-items:center}
.pvbar .opt .ol{font-weight:500}
.pvcount{font-size:12px; color:var(--muted)}
.pvhelp{flex-basis:100%; font-size:12px; color:var(--muted); line-height:1.45}
.pvsec{display:flex; align-items:center; gap:10px; margin:30px 0 12px; padding:0 0 6px; border-bottom:2px solid var(--accent)}
.pvbar + .pvsec, .pvbar + .addhead{margin-top:4px}
.shtag{flex:0 0 auto; font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--accent)}
input.shin{flex:1; min-width:0; width:auto; border:1px solid transparent; background:transparent; border-radius:4px;
  font-family:Literata,Georgia,"Times New Roman",serif; font-size:19px; font-weight:600; padding:2px 6px; color:var(--ink)}
input.shin:hover{background:var(--surface-2)}
input.shin:focus{background:var(--surface); border-color:var(--accent); outline:none}
.sdel{flex:0 0 auto; border:0; background:none; color:var(--muted); font-size:17px; line-height:1; padding:2px 6px; border-radius:4px; opacity:.5}
.pvsec:hover .sdel,.tnote:hover .sdel,.sdel:focus-visible{opacity:1}
.sdel:hover{color:var(--sig)}
.addrow{display:flex; margin:0 0 12px}
.addhead{margin-top:14px}
.addbtn{border:1px dashed var(--rule); background:transparent; color:var(--muted); border-radius:5px; padding:4px 10px; font-size:12px}
.addbtn:hover{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
.tblwrap .addnote{margin:0; padding:8px 14px 12px; border-top:1px solid var(--rule-soft)}
.tnote{border-top:1px solid var(--rule-soft); padding:10px 14px 12px; background:var(--sec-tint)}
.tnhead{display:flex; align-items:center; justify-content:space-between; font-size:10.5px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--accent); margin:0 0 2px}
textarea.tnin{width:100%; min-height:2.6em; field-sizing:content; resize:none; overflow:hidden; border:1px solid transparent; background:transparent;
  font-size:13.5px; line-height:1.5; padding:4px 6px; color:var(--ink); border-radius:4px}
textarea.tnin:hover{border-color:var(--rule)}
textarea.tnin:focus{background:var(--surface); border-color:var(--accent); outline:none}
.tochead{font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); padding:9px 10px 3px}
.selhead{font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--accent);
  padding:8px 6px 3px; border-bottom:1px solid var(--rule-soft); overflow-wrap:anywhere}

/* ---------- tables ---------- */
.tblwrap{
  background:var(--surface); border:1px solid var(--rule); border-radius:5px;
  margin:0 0 22px; box-shadow:var(--shadow); overflow:hidden;
}
.tblwrap>header{padding:12px 14px 9px; border-bottom:1px solid var(--rule-soft);
  display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap}
.tbltitle{min-width:0; flex:1}
.sortsel{width:auto; font-size:12px; padding:3px 6px; color:var(--muted)}
.tblctl{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.swatches{display:flex; gap:7px; flex-wrap:wrap; margin-top:2px}
.swatch{
  width:24px; height:24px; border-radius:4px; border:1px solid var(--rule); padding:0; position:relative;
}
.swatch.nocolor{background:var(--surface)}
.swatch.nocolor::after{
  content:""; position:absolute; left:3px; right:3px; top:50%; height:1px;
  background:var(--muted); transform:rotate(-45deg);
}
.swatch[aria-pressed="true"],.swatch[aria-checked="true"]{outline:2px solid var(--accent); outline-offset:1px}
/* header: Tables / Dataset switch, the file button, the weight menu */
.viewsw{flex:0 0 auto}
.viewsw button{padding:4px 12px}
.bar .fileinfo{flex:1 1 0; min-width:90px; max-width:max-content; border:0; background:none; border-radius:4px; padding:4px 7px; cursor:pointer; text-align:left}
.bar .fileinfo::after{content:" ⓘ"; color:var(--muted)}
.bar .fileinfo:hover{background:var(--surface-2); color:var(--ink)}
.wpop{width:400px}
.wfind{margin:8px 10px 4px; width:calc(100% - 20px)}
.wlist{padding:2px 0}
.wopt{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; border:0; background:none; padding:7px 12px; font-size:13px; color:var(--ink)}
.wopt:hover,.wopt:focus-visible{background:var(--surface-2); outline:none}
.wdot{flex:0 0 auto; width:15px; height:15px; margin-top:2px; border-radius:50%; border:1.5px solid var(--muted)}
.wopt[aria-checked="true"] .wdot{border-color:var(--accent); background:radial-gradient(circle, var(--accent) 0 3.5px, transparent 4.5px)}
.wtx{flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:2px 8px; align-items:baseline}
.wtx b{font-weight:600}
.wtx small{flex-basis:100%; color:var(--muted); font-size:12px; line-height:1.35; overflow-wrap:anywhere}
.wtag{font-size:10.5px; font-weight:600; color:var(--accent); background:var(--accent-soft); border-radius:3px; padding:1px 6px}
.popfoot{border-top:1px solid var(--rule-soft); padding:9px 12px 11px; font-size:12px; color:var(--muted); line-height:1.45}
.popwarn{color:var(--warn); margin-bottom:6px}
.filepop .filelead{font-weight:600; color:var(--ink)}
/* the cells-and-statistics tab: two parts with headers that stay in view */
.part + .part{margin-top:26px}
.sec .body > .part:first-child .parth{margin-top:-14px}
.parth{position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:9px; margin:0 -16px 12px; padding:9px 16px;
  font-size:14.5px; color:var(--ink); background:var(--surface-2); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule)}
.partico{display:grid; place-items:center; width:20px; height:20px; border-radius:4px; background:var(--accent); color:var(--accent-ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:12px; font-weight:600}
/* weight chip in the top bar */
.wchip{color:var(--muted); font-size:12px; white-space:nowrap; max-width:240px; overflow:hidden; text-overflow:ellipsis}
.wchip.on{color:var(--accent); border-color:var(--accent)}
.wchip.warn{color:var(--warn); border-color:var(--warn)}

/* the order of tables: a bar under the list, the list itself in a window */
.ordbar{display:flex; gap:8px; align-items:center; margin:10px 0 0; padding:8px 10px; border:1px solid var(--rule); border-radius:6px; background:var(--surface-2)}
.ordbar .tt{font-size:12.5px; font-weight:600}
.ordbar .spacer{flex:1}
.modal.orddlg{width:min(720px, 96vw); max-width:96vw}
.orddlg .field{margin-bottom:8px}
.orddlg>footer{justify-content:flex-end}
.orddlg .sellist{max-height:min(62vh, 640px); background:var(--surface)}
.sellist{border:1px solid var(--rule-soft); border-radius:4px; max-height:30vh; overflow-y:auto; overscroll-behavior:contain}
.selrow{display:flex; gap:6px; align-items:flex-start; padding:4px 6px; border-bottom:1px solid var(--rule-soft); font-size:12.5px}
.selrow:last-child{border-bottom:0}
.selrow:hover{background:var(--surface-2)}
.selrow .gr{flex:0 0 auto; cursor:grab; color:var(--muted); font-size:12px; line-height:1.5; padding:0 1px}
.selrow .ix{flex:0 0 auto; min-width:16px; color:var(--muted); font-variant-numeric:tabular-nums; font-size:11.5px; line-height:1.5}
.selrow .tt{flex:1; min-width:0; overflow-wrap:anywhere; line-height:1.3}
.selrow .tt small{display:block; color:var(--muted); font-size:11px}
.selrow button{padding:0 5px; border:0; background:none; color:var(--muted); font-size:12px; line-height:1.4}
.selrow button:hover:not(:disabled){color:var(--accent)}
.selrow button:disabled{opacity:.3}
.selrow .rm:hover{color:var(--sig)}
.dragging{opacity:.45}
.dropmark{box-shadow:inset 0 2px 0 var(--accent)}
.dropafter{box-shadow:inset 0 -2px 0 var(--accent)}
.mgrip{flex:0 0 auto; align-self:center; cursor:grab; touch-action:none; color:var(--muted); font-size:14px; line-height:1;
  padding:3px 2px; margin-left:-4px; border-radius:3px; user-select:none; -webkit-user-select:none}
.mgrip:hover,.mgrip:focus-visible{color:var(--accent); background:var(--surface-2)}
.measlist .opt.dragging .mgrip{cursor:grabbing}
.bnrrow .gr{cursor:grab; color:var(--muted); font-size:12px; margin-right:6px}
.bnrmeta{font-size:11px; color:var(--muted); margin-top:2px}
.popv .techbox{flex:0 0 auto; margin:2px 0 0}

/* the author's tabs in the Report tab, and the builder over the page */
.rtabs{border:1px solid var(--rule-soft); border-radius:6px; margin:0 0 10px; background:var(--surface)}
.rtab{display:flex; gap:8px; align-items:center; padding:7px 10px; border-bottom:1px solid var(--rule-soft)}
.rtab:last-child{border-bottom:0}
.rtab .rtt{flex:1; min-width:0}
.rtab .rtt b{display:block; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rtab .rtt small{display:block; font-size:11.5px; color:var(--muted)}
.rtab.main .rtt b{color:var(--ink-2)}
.rtab.dragging{opacity:.45}
.tbuild{position:fixed; inset:0; z-index:300; background:var(--paper); display:flex; flex-direction:column}
.tbuild>header{display:flex; gap:14px; align-items:center; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--rule)}
.tbuild>header h2{font-size:16px; margin:0; white-space:nowrap}
.tbuild .tbhint{flex:1; font-size:12.5px; color:var(--muted); min-width:0}
.tbframe{flex:1; width:100%; border:0; background:#fff}
/* response sets in the variable list */
.mrbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 8px; padding:6px 8px;
  border:1px solid var(--rule); border-left:3px solid var(--accent); border-radius:5px; background:var(--sec-tint)}
.mrbarlbl{flex-basis:100%; font-size:12px; font-weight:600; color:var(--accent)}
.mrbar .mrbtn{flex:1 1 0; min-width:max-content}
.btn.mrbtn{border-color:var(--accent); color:var(--accent); background:var(--surface)}
.btn.mrbtn:hover:not(:disabled){background:var(--accent); color:var(--accent-ink)}
.vitem.mrrow{background:var(--sec-tint)}
.vitem.mrrow .lb{font-weight:600}
.glyph.mr{background:var(--accent); color:var(--accent-ink); font-size:9px; font-weight:600; width:22px}
.vitem.member{padding-left:32px; background:var(--surface)}
.vitem.member + .vitem:not(.member){border-top:1px solid var(--rule)}
.vitem .chev{min-width:26px}
.mrdlg .mrtools{margin:0 0 6px}
.mrdlg .mrtools input[type=search]{flex:1 1 180px; width:auto}
.mrdlg .mrtools .opt{margin:0; padding:0; flex:0 0 auto}
.mrdlg .mrpick{max-height:min(46vh, 340px)}
/* table of contents (popup from the top bar) */
.tocpop{
  position:fixed; z-index:95; width:420px; max-width:94vw; background:var(--surface);
  border:1px solid var(--rule); border-radius:5px; box-shadow:0 12px 34px rgba(20,26,34,.24);
  display:flex; flex-direction:column; max-height:min(70vh, 560px); overflow:hidden;
}
.tocpop>header{display:flex; gap:10px; align-items:center; padding:9px 12px;
  background:var(--surface-2); border-bottom:1px solid var(--rule-soft)}
.tocpop>header .tt{font-size:12.5px; font-weight:600}
.tocpop>header .cnt{font-size:11.5px; color:var(--muted)}
.tocpop>header .spacer{flex:1}
.tocpop>header button{border:0; background:none; color:var(--muted); font-size:15px; line-height:1; padding:0 2px}
.tocpop>header button:hover{color:var(--sig)}
.tocbody{flex:1; overflow-y:auto; overscroll-behavior:contain; padding:4px 0}
.tocitem{display:flex; gap:8px; align-items:baseline; width:100%; text-align:left; border:0; background:none;
  padding:4px 12px; font-size:12.5px; line-height:1.3; color:var(--ink)}
.tocitem:hover{background:var(--surface-2); color:var(--accent)}
.tocitem .n{color:var(--muted); font-size:11px; min-width:20px; font-variant-numeric:tabular-nums}
.tocitem .tx{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tocitem .vn{color:var(--muted); font-size:11px; white-space:nowrap}
.tocsearch{padding:7px 12px; border-bottom:1px solid var(--rule-soft)}
.tocsearch input{font-size:12.5px; padding:4px 7px}
.tblwrap.flash{outline:2px solid var(--accent); outline-offset:-1px}
.onebtn{color:var(--muted); font-size:11.5px; padding:2px 7px}
.rmbtn{font-size:13px; line-height:1; padding:1px 7px}
.rmbtn:hover{border-color:var(--sig); color:var(--sig)}
.pop{
  position:fixed; z-index:90; width:320px; max-width:92vw; max-height:60vh; overflow:auto;
  background:var(--surface); border:1px solid var(--rule); border-radius:5px;
  box-shadow:0 10px 30px rgba(20,26,34,.22); font-size:12.5px;
}
.pop header{
  position:sticky; top:0; background:var(--surface-2); border-bottom:1px solid var(--rule-soft);
  padding:8px 10px; display:flex; gap:8px; align-items:flex-start;
}
.pop header .t{flex:1; min-width:0}
.pop header .t b{display:block; font-weight:600}
.pop header .t span{color:var(--muted); font-size:11.5px}
.pop header button{border:0; background:none; color:var(--muted); font-size:15px; line-height:1; padding:0 2px}
.pop header button:hover{color:var(--sig)}
.popv{display:flex; gap:8px; padding:4px 10px; border-bottom:1px solid var(--rule-soft)}
.popv:last-child{border-bottom:0}
.popv .code{color:var(--muted); font-variant-numeric:tabular-nums; min-width:34px}
.popv .lab{flex:1; overflow-wrap:anywhere}
.popv .cnt{color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.popv.miss .lab{font-style:italic; color:var(--muted)}
.popnote{padding:7px 10px; color:var(--muted); font-size:11.5px}
.valbtn{padding:3px 6px; font-size:11px; line-height:1.2}
.toastbtn{
  margin-left:10px; border:0; background:none; color:var(--accent-soft); font-size:13px;
  font-weight:600; text-decoration:underline; padding:0;
}
.exportbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  padding:8px 12px; margin-bottom:16px; border:1px solid var(--rule); border-radius:5px;
  background:var(--surface); font-size:12.5px; color:var(--ink-2)}
.exportbar .spacer{flex:1}
.tblwrap h3{font-size:15px; line-height:1.25}
.tblwrap .vname{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:2px}
.scroll{overflow-x:auto}
table.ct{--lblw:300px; --colw:82px; --measw:58px; border-collapse:collapse; width:100%; table-layout:fixed; font-size:12.5px; font-variant-numeric:tabular-nums}
table.ct col.c-lbl{width:var(--lblw)}
table.ct col.c-meas{width:var(--measw)}
table.ct th,table.ct td{overflow-wrap:anywhere}
table.ct th,table.ct td{border:1px solid var(--rule-soft); padding:4px 7px; text-align:center; vertical-align:middle}
table.ct th{background:var(--surface-2); font-weight:600; text-align:center; font-size:12px; line-height:1.25}
table.ct th.lbl,table.ct td.lbl{text-align:left; font-weight:400; min-width:190px; max-width:340px}
table.ct td.lbl{background:var(--surface)}
table.ct tr.base th,table.ct tr.base td{background:var(--surface-2); font-weight:600; font-size:12px}
table.ct td.meas{color:var(--muted); font-size:11.5px; text-align:center; min-width:0; width:1%}
table.ct sup{color:var(--sig); font-size:9.5px; margin-left:2px; letter-spacing:.3px}
table.ct td.low{color:var(--low)}
table.ct .techbtn{
  border:0; background:none; color:var(--rule); font-size:11px; padding:0 3px; margin-left:4px;
  line-height:1; vertical-align:middle;
}
table.ct .techbtn:hover{color:var(--accent)}
table.ct tr.cat td.lbl .grip{cursor:grab; color:var(--rule); margin-right:5px; font-size:11px; user-select:none}
table.ct tr.cat:hover td.lbl .grip{color:var(--muted)}
table.ct .rowact{border:0; background:none; color:var(--muted); font-size:11px; padding:0 3px; margin-left:3px;
  opacity:0; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:2px}
table.ct tr.cat:hover .rowact, table.ct .rowact:focus-visible{opacity:1}
table.ct .rowact:hover{color:var(--sig)}
table.ct tr.dragging{opacity:.45}
table.ct tr.dropmark td{box-shadow:inset 0 2px 0 var(--accent)}
.restorebtn{color:var(--accent)}
.modbtn{color:var(--accent); border-color:var(--accent)}
table.ct tr.netrow td.lbl{font-weight:600}
.vitem.derived{background:var(--accent-soft)}
.vitem.derived .glyph{background:var(--accent); color:var(--accent-ink)}
.editbtn{color:var(--muted)}
.editbtn.edited{color:var(--accent); border-color:var(--accent)}
.mrmod{margin:6px 0 0 14px; font-size:12.5px}
.expblock{border:1px solid var(--rule); border-radius:6px; padding:12px 14px 6px; margin:0 0 14px; background:var(--surface)}
.expblock .field:last-of-type{margin-bottom:10px}
.exph{display:flex; gap:8px; align-items:center; font-size:13.5px; font-weight:650; margin:0 0 4px; color:var(--ink)}
.expico{display:inline-flex; width:22px; height:22px; align-items:center; justify-content:center; border-radius:4px; background:var(--accent-soft); color:var(--accent); font-size:13px}
.expdesc{margin:0 0 10px}
.expbtns{gap:6px; flex-wrap:wrap; margin:4px 0 8px}
.expstate{margin:-4px 0 8px; font-weight:600; color:var(--ink-2)}
.btn.spss{background:#A6192E; color:#fff; border-color:#A6192E}
.btn.spss:hover:not(:disabled){background:#8A1426; border-color:#8A1426; color:#fff}
.modal-ov{position:fixed; inset:0; z-index:200; background:rgba(15,20,28,.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto}
.modal{background:var(--surface); color:var(--ink); border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.3); width:min(560px, 100%); display:flex; flex-direction:column; max-height:90vh}
.modal.wide{width:min(980px, 100%)}
.modal>header{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--rule)}
.modal>header h2{font-size:16px; flex:1; margin:0}
.modal-x{border:0; background:none; font-size:20px; line-height:1; color:var(--muted); padding:0 4px}
.modal-x:hover{color:var(--sig)}
.modal-body{padding:14px 18px; overflow-y:auto; flex:1}
.modal>footer{display:flex; gap:8px; align-items:center; padding:12px 18px; border-top:1px solid var(--rule)}
.modal>footer .spacer{flex:1}
.btn.danger{color:var(--sig); border-color:var(--sig)}
.btn.ghost{border-color:transparent; color:var(--muted); padding:1px 6px}
.btn.ghost:hover{color:var(--accent)}
.mod-src{font-size:12.5px; color:var(--muted); margin:0 0 10px}
.mod-title{display:flex; gap:8px; align-items:center}
.mod-title input{flex:1}
.mod-suffix{font-weight:600; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums}
.mod-mode{margin:0 0 12px}
.mod-mode button:disabled{opacity:.45; cursor:not-allowed}
.mod-bar{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:0 0 8px}
.mod-count{margin:0 0 0 auto}
.mod-list{border:1px solid var(--rule-soft); border-radius:5px; padding:2px 6px; margin:0 0 10px}
.mod-row{display:flex; gap:8px; align-items:center; padding:5px 0; border-bottom:1px solid var(--rule-soft)}
.mod-row:last-child{border-bottom:0}
.mod-row.net{background:var(--accent-soft); margin:0 -6px; padding-left:6px; padding-right:6px}
.mod-row .grip{cursor:grab; color:var(--muted); user-select:none}
.mod-row input[type=checkbox]{margin:0}
.mod-row .mod-label{flex:1 1 45%; min-width:120px; padding:4px 7px}
.mod-row.net .mod-label{font-weight:600}
.mod-meta{flex:0 1 30%; font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mod-row.range input[type=number]{width:90px; padding:4px 6px}
.mod-row.dragging{opacity:.45}
.mod-row.dropmark{box-shadow:inset 0 2px 0 var(--accent)}
.mod-k{width:60px !important; padding:3px 6px}
.mod-off{border:1px dashed var(--rule); border-radius:5px; padding:6px 10px; margin:0 0 10px}
.mod-offrow{display:flex; gap:8px; align-items:center; font-size:12.5px; padding:2px 0}
.mod-offrow span:first-child{flex:1}
.mod-outside{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin:4px 0 10px}
.mod-outside .segc{flex:1 1 320px}
.mod-prevhead{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:12px 0 6px}
.mod-preview .tblwrap{margin:0; box-shadow:none}
.ve-list{border:1px solid var(--rule-soft); border-radius:5px; padding:2px 8px; margin:6px 0 10px; max-height:50vh; overflow-y:auto}
.ve-row{display:flex; gap:10px; align-items:center; padding:4px 0; border-bottom:1px solid var(--rule-soft)}
.ve-row:last-child{border-bottom:0}
.ve-code{min-width:42px; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px}
.ve-row input{flex:1; padding:4px 7px}
table.ct .techbtn.on{color:var(--sig)}
table.ct tr.tech td.lbl{color:var(--muted); font-style:italic}
table.ct th.gsep,table.ct td.gsep{border-left:2px solid var(--muted)}
table.ct th.tot{background:var(--accent-soft)}
table.ct td.tot{background:var(--accent-soft); font-weight:600}
table.ct tr.base td.tot{background:var(--accent-soft)}
table.ct tr.stat td,table.ct tr.stat th{border-top:1.5px solid var(--rule)}
table.ct tbody tr:hover td:not(.lbl){background:var(--row-hover)}
table.ct tbody tr:hover td.lbl{background:var(--row-hover)}
table.ct tbody tr:hover td.tot{background:var(--row-hover-tot)}
.notes{padding:8px 14px 12px; font-size:11.5px; color:var(--muted)}
.notes div{margin-bottom:3px}
.ct .stickycol{position:sticky; z-index:2}
.ct thead .stickycol{z-index:4}
.ct .stickyedge{box-shadow:2px 0 0 0 var(--muted)}
.scroll{position:relative}

.status{
  display:flex; gap:10px; align-items:center; padding:9px 12px; margin-bottom:16px;
  border:1px solid var(--rule); border-radius:5px; background:var(--surface); font-size:13px;
}
.status.warn{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}

/* ---------- dataset view ---------- */

.dvgrid{flex:1 1 auto; min-width:0; min-height:0; display:flex}
.dvlog{flex:0 0 320px; min-height:0; overflow-y:auto; overscroll-behavior:contain; background:var(--surface); border:1px solid var(--rule); border-radius:5px; padding:10px 12px}
.dvloghead{display:flex; gap:6px; align-items:center; margin-bottom:8px}
.dvloghead .spacer{flex:1}
.dvlogitem{border-top:1px solid var(--rule-soft); padding:7px 2px; cursor:pointer; font-size:12.5px}
.dvlogitem:hover{background:var(--surface-2)}

.dvlogitem .tm{color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums}
.dvlogitem .vn{color:var(--accent); font-weight:600}
.dvlogitem .spacer{flex:1}
.dvlogitem .lc{margin-top:3px; color:var(--ink-2); overflow-wrap:anywhere}
.dvlogitem .old{text-decoration:line-through; color:var(--muted)}
.dvlogitem .nw{font-weight:600; color:var(--ink)}
.rdwarn{background:var(--warn-bg); color:var(--warn); padding:7px 9px; border-radius:4px}

.rdtools input{flex:1; min-width:0; padding:3px 7px; font-size:12px}
.rdlist{border:1px solid var(--rule-soft); border-radius:4px; max-height:34vh; overflow-y:auto; overscroll-behavior:contain; padding:2px 6px}
.rditem{display:flex; gap:7px; align-items:flex-start; padding:3px 0; font-size:12px; line-height:1.3; cursor:pointer}
.rditem[hidden]{display:none}
.rditem input{margin:2px 0 0}
.rditem b{font-weight:600}
.rditem .rdstr{color:var(--warn); font-style:normal}
.rdcount{margin:5px 0 10px}
.rdpw{color:var(--warn); font-size:12px; margin:0 0 8px}
.modal .cewarn{color:var(--warn); font-weight:600}
/* ---------- data grid (shared by the tool and the interactive report) ---------- */
.dgwrap{position:relative; display:flex; flex-direction:column; min-height:0; flex:1 1 auto}
.dg{position:relative; flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; background:var(--surface);
  border:1px solid var(--rule); border-radius:5px; font-size:12.5px; font-variant-numeric:tabular-nums; outline:none}
.dg:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.dg-layer{position:relative}
.dg-edlayer{position:absolute; top:0; left:0; z-index:20}
.dg-head{position:sticky; top:0; z-index:6; display:flex; height:58px; background:var(--surface-2)}
.dg-hfz{position:sticky; left:0; z-index:10; flex:0 0 auto; height:58px; background:var(--surface-2)}
.dg-hs{position:relative; z-index:1; flex:0 0 auto; height:58px}
.dg-body{display:flex; position:relative}
.dg-fcol{position:sticky; left:0; z-index:5; flex:0 0 auto; height:100%; background:var(--surface-2)}
.dg-cells{position:relative; z-index:1; flex:0 0 auto; height:100%}
.dg .c,.dg .h{position:absolute; box-sizing:border-box; border-right:1px solid var(--rule-soft); border-bottom:1px solid var(--rule-soft)}
.dg .c{height:26px; line-height:25px; padding:0 7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink); background:var(--surface); cursor:cell}
.dg .c.num{text-align:right}
.dg .c.selrow{background:color-mix(in srgb, var(--accent) 6%, var(--surface))}
.dg .c.sel{outline:2px solid var(--accent); outline-offset:-2px; z-index:1; background:var(--surface)}
.dg .c.der{color:var(--ink-2); background:color-mix(in srgb, var(--surface-2) 55%, var(--surface))}
.dg .c.umis{color:var(--muted); font-style:italic}
.dg .c.del{color:var(--muted); text-decoration:line-through; background:color-mix(in srgb, #B42318 5%, var(--surface))}
.dg .c.fz{z-index:3; background:var(--surface-2)}
.dg .c.fz.selrow{background:color-mix(in srgb, var(--accent) 12%, var(--surface-2))}
.dg .c.idc{font-weight:600; border-right:2px solid var(--muted); cursor:cell}
.dg .c.idc.sel{z-index:4}
.dg .c.rn{display:flex; align-items:center; justify-content:space-between; gap:2px; padding:0 3px 0 6px; color:var(--muted); font-size:11.5px; cursor:default}
.dg .c.rn.del{text-decoration:none}
.dg .c.rn .rnn{overflow:hidden; text-overflow:ellipsis}
.dg .rdel{border:0; background:none; color:var(--muted); font-size:13px; line-height:1; padding:2px 4px; border-radius:3px; opacity:0; cursor:pointer}
.dg .c.rn:hover .rdel,.dg .c.rn.del .rdel,.dg .c.rn.selrow .rdel{opacity:1}
.dg .rdel:hover{color:#B42318; background:var(--surface)}
.dg .c.rn.del .rdel{color:var(--accent)}
.dg .h{height:58px; z-index:5; background:var(--surface-2); padding:5px 20px 4px 7px; border-bottom:1.5px solid var(--rule); cursor:default}
.dg .h.fz{z-index:7}
.dg .h.idh{border-right:2px solid var(--muted)}
.dg .h.corner{z-index:8; display:flex; align-items:flex-end; color:var(--muted)}
.dg .h.selh{box-shadow:inset 0 -2px 0 var(--accent)}
.dg .h.der .hn{color:var(--ink-2)}
.dg .hn{font-weight:650; font-size:12px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dg .hn .ro{font-size:10px; opacity:.6}
.dg .hl{font-size:11px; line-height:1.25; color:var(--muted); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; margin-top:1px}
.dg .hf{position:absolute; right:3px; top:4px; width:17px; height:17px; border:1px solid var(--rule); border-radius:3px; background:var(--surface);
  color:var(--muted); font-size:10px; line-height:14px; padding:0; cursor:pointer}
.dg .hf:hover{border-color:var(--accent); color:var(--accent)}
.dg .hf.on{background:var(--accent); border-color:var(--accent); color:#fff}
.dg .rz{position:absolute; right:-3px; top:0; width:7px; height:100%; cursor:col-resize; z-index:2}
.dg .rz:hover{background:color-mix(in srgb, var(--accent) 35%, transparent)}
.dg-empty{position:absolute; padding:18px 16px; color:var(--muted); font-size:13px}
/* editor */
.dg-ed{position:absolute; z-index:20; min-width:120px}
.dg-in{display:block; width:100%; height:26px; box-sizing:border-box; border:2px solid var(--accent); border-radius:0; padding:0 6px;
  font:inherit; font-size:12.5px; background:var(--surface); color:var(--ink); outline:none}
.dg-list{max-height:220px; overflow-y:auto; background:var(--surface); border:1px solid var(--rule); border-top:0; box-shadow:0 10px 24px rgba(20,26,34,.18)}
.dg-opt{padding:4px 8px; font-size:12.5px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dg-opt b{display:inline-block; min-width:26px; color:var(--muted); font-weight:600}
.dg-opt:hover,.dg-opt.on{background:var(--accent-soft)}
.dg-opt.none{color:var(--muted); font-style:italic; cursor:default; white-space:normal}
.dg-msg{background:#B42318; color:#fff; font-size:11.5px; padding:3px 7px}
/* filter popup */
.dg-pop{position:absolute; z-index:40; width:280px; background:var(--surface); border:1px solid var(--rule); border-radius:6px;
  box-shadow:0 14px 34px rgba(20,26,34,.22); padding:8px; font-size:12.5px; color:var(--ink)}
.dg-ph{display:flex; flex-direction:column; gap:1px; padding:0 2px 6px; border-bottom:1px solid var(--rule-soft); margin-bottom:6px}
.dg-ph span{color:var(--muted); font-size:11.5px; line-height:1.25; max-height:2.6em; overflow:hidden}
.dg-prow{display:flex; gap:6px; margin-bottom:6px}
.dg-prow button,.dg-pbtn button{flex:1; border:1px solid var(--rule); background:var(--surface); border-radius:4px; padding:3px 6px; font:inherit; font-size:12px; color:var(--ink); cursor:pointer}
.dg-prow button:hover,.dg-pbtn button:hover{border-color:var(--accent); color:var(--accent)}
.dg-ps{width:100%; box-sizing:border-box; padding:4px 7px; border:1px solid var(--rule); border-radius:4px; margin-bottom:6px; font:inherit; font-size:12.5px; background:var(--surface); color:var(--ink)}
.dg-pall{display:flex; gap:6px; align-items:center; padding:3px 2px; font-weight:600; border-bottom:1px solid var(--rule-soft)}
.dg-plist{max-height:260px; overflow-y:auto; overscroll-behavior:contain; margin:2px 0 6px}
.dg-pi{display:flex; gap:6px; align-items:flex-start; padding:3px 2px; border-radius:3px; cursor:pointer}
.dg-pi:hover{background:var(--surface-2)}
.dg-pi[hidden]{display:none}
.dg-pi span{flex:1; min-width:0; line-height:1.3; overflow-wrap:anywhere}
.dg-pi i{color:var(--muted); font-style:normal; font-size:11px}
.dg-pi small{color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
.dg-pi input,.dg-pall input{margin:2px 0 0; accent-color:var(--accent)}
.dg-more{color:var(--muted); font-size:11px; padding:4px 2px}
.dg-pbtn{display:flex; gap:6px; align-items:center; border-top:1px solid var(--rule-soft); padding-top:7px}
.dg-pbtn span{flex:1}
.dg-pbtn .dg-clear{flex:0 0 auto}
.dg-pbtn .dg-ok{background:var(--accent); border-color:var(--accent); color:#fff; flex:0 0 56px}
.dg-pbtn .dg-ok:hover{color:#fff; filter:brightness(1.08)}
.dg-pbtn .dg-cancel{flex:0 0 auto}

/* ---- open (text) answers: a collapsible list ---- */
.oblk{border:1px solid var(--rule); border-radius:6px; background:var(--surface); margin:10px 0 4px; overflow:hidden}
.oblk.linked{margin:0; border-width:1px 0 0; border-radius:0}
.ohd{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:8px 12px; background:var(--surface-2); border-bottom:1px solid var(--rule-soft)}
.ott{font-size:12px; font-weight:650; text-transform:uppercase; letter-spacing:.04em; color:var(--accent)}
.obase{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.ospacer{flex:1}
.otools{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.otools .osearch,.otools .ofilt{font:inherit; font-size:12.5px; padding:4px 8px; border:1px solid var(--rule); border-radius:5px; background:var(--surface); color:var(--ink); min-width:0}
.otools .osearch{width:170px}
.otools .ofilt{max-width:200px}
.oseg button{font-size:12px}
.obody{padding:0}
.olist{width:100%; border-collapse:collapse; font-size:13px}
.olist th{font-size:11px; font-weight:600; color:var(--muted); text-align:left; padding:6px 12px; border-bottom:1px solid var(--rule-soft); background:var(--surface)}
.olist td{padding:5px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:top; color:var(--ink); line-height:1.4}
.olist tr:last-child td{border-bottom:0}
.olist .on{width:90px; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.olist th.on{text-align:right}
.olist .oi{width:40px; color:var(--muted); font-variant-numeric:tabular-nums}
.olist .oid{width:90px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.olist .ot{word-break:break-word}
.omore{display:flex; align-items:center; gap:10px; padding:8px 12px; border-top:1px solid var(--rule-soft)}
.omini{font-size:12px; color:var(--muted)}
.onone{padding:10px 12px; font-size:12.5px; color:var(--muted)}
@media print{
  .otools,.omore button{display:none !important}
  .oblk{break-inside:auto}
}
/* quotes chosen by the report's author */
.xquotes{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; margin:4px 0 2px}
.xquote{margin:0; padding:12px 16px 12px 18px; border-left:4px solid var(--accent); background:var(--surface-2); border-radius:0 6px 6px 0;
  font-size:15px; line-height:1.5; font-style:italic; color:var(--ink)}
.xquote::before{content:'«'; color:var(--accent); font-weight:700; margin-right:2px; font-style:normal}
.xquote::after{content:'»'; color:var(--accent); font-weight:700; margin-left:2px; font-style:normal}
.xqsrc{font-size:12px; color:var(--muted); margin:8px 0 0}

.txtbar{margin-top:-2px}
.vitem .glyph.open{color:var(--accent); font-weight:700}
.opencard .oblk{margin:0; border-width:1px 0 0; border-radius:0}
.tblwrap .oblk.linked{border-top:1px solid var(--rule)}
.modal.opendlg{width:min(980px, 96vw)}
.odfound{margin:0 0 10px; padding:8px 12px; border-radius:6px; background:color-mix(in srgb, var(--accent) 10%, var(--surface)); color:var(--ink); font-size:13px}
.odlist{border:1px solid var(--rule); border-radius:6px; max-height:min(52vh, 520px); overflow-y:auto; margin:6px 0 14px}
.modal.opendlg>footer{justify-content:flex-end}
.odrow{display:grid; grid-template-columns:64px minmax(0,1fr) 230px 250px; gap:10px; align-items:start; padding:8px 10px; border-bottom:1px solid var(--rule-soft); font-size:13px}
.odrow:last-child{border-bottom:0}
.odrow.odhead{position:sticky; top:0; background:var(--surface-2); font-size:11.5px; font-weight:600; color:var(--muted); z-index:1; align-items:center}
.odrow input[type=checkbox]{margin:3px auto 0}
.odrow.odhead span:first-child{text-align:center}
.odrow .lb{font-weight:600}
.odrow .nm{font-size:11.5px; color:var(--muted)}
.odrow .odex{font-size:12px; color:var(--ink-2); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.odrow select{width:100%; min-width:0}
.odrow.off .txt{opacity:.55}
.odopts{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:6px 18px; align-items:start}
.odopts .field{margin:0}
.odshow select{width:auto}
@media (max-width:760px){ .odrow{grid-template-columns:40px minmax(0,1fr)} .odrow select{grid-column:2} .odrow.odhead span:nth-child(n+3){display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<div class="bar">

          <span class="mrbarlbl" id="openBarLbl"></span>

          <button class="btn small mrbtn" id="btnOpenFind"></button>

    </details>

    <details class="sec" open>
      <summary><span data-i18n="sec.banner"></span> <span class="count" id="cntBanner"></span></summary>
      <div class="body">
        <p class="secdesc" id="bannerHint" data-i18n="banner.hint"></p>

<script id="src-open">/* ---------------- open (text) answers: grouping, masking and the collapsible block ----------------
   Shared by the tool and the HTML report. A block is
   { head, sub, items:[{t, g:[category index per banner variable]}], total, banner:[{label, cats}] }
   and is drawn with the host's strings L and a state object st that survives re-rendering
   ({ view:'group'|'list', q, f:'g:c', open }). */
(function (root) {
  var EDGE = /^[\s"'«»“”„.,;:!?…\-–—]+|[\s"'«»“”„.,;:!?…\-–—]+$/g;
  function norm(t) { return String(t).toLowerCase().replace(/\s+/g, ' ').replace(EDGE, '').trim(); }
  /* phone numbers keep their last two digits, e-mails their first letter and domain zone */
  function mask(t) {
    return String(t)
      .replace(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g, function (m) {
        return m.charAt(0) + '•••@•••' + m.slice(m.lastIndexOf('.'));
      })
      .replace(/\+?\d[\d\s\-().]{7,}\d/g, function (m) {
        var total = m.replace(/\D/g, '').length, seen = 0;
        if (total < 9) return m;
        return m.replace(/\d/g, function (d) { seen++; return seen > total - 2 ? d : '•'; });

  }

      if (!g) { g = map[k] = { n: 0, v: Object.create(null), t: x.t }; out.push(g); }
      g.n++; g.v[x.t] = (g.v[x.t] || 0) + 1;
    });

    var cap = function (t) { var c = t.charAt(0); return c !== c.toLowerCase(); };
    out.forEach(function (g) {
      var best = 0;
      Object.keys(g.v).forEach(function (t) { if (g.v[t] > best || (g.v[t] === best && cap(t) && !cap(g.t))) { best = g.v[t]; g.t = t; } });
    });
    out.sort(function (a, b) { return b.n - a.n || a.t.localeCompare(b.t); });

    st.view = st.view || opt.view || 'group';
    var box = el('div', 'oblk' + (opt.linked ? ' linked' : ''));
    var hd = el('div', 'ohd');
    if (b.head) hd.appendChild(el('span', 'ott', b.head));
    var base = el('span', 'obase'); hd.appendChild(base);
    hd.appendChild(el('span', 'ospacer'));
    var tools = el('div', 'otools');
    /* a filter by a banner group (the report) */
    var fsel = null;
    if (b.banner && b.banner.length) {
      fsel = el('select', 'ofilt'); fsel.setAttribute('aria-label', L.filter);
      var o0 = el('option', '', L.everyone); o0.value = ''; fsel.appendChild(o0);
      b.banner.forEach(function (bv, gi) {
        var og = el('optgroup'); og.label = bv.label;
        bv.cats.forEach(function (c, ci) { var op = el('option', '', c); op.value = gi + ':' + ci; og.appendChild(op); });
        fsel.appendChild(og);

      var tbl = el('table', 'olist');

      else { tr0.appendChild(el('th', 'oi', '#')); if (opt.ids) tr0.appendChild(el('th', 'oid', 'ID')); tr0.appendChild(el('th', 'ot', L.answer)); }

<script type="text/plain" id="rep-css">:root{
  color-scheme: light;
  --paper:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF1F5; --rule:#D5DAE2; --rule-soft:#E6E9EF;
  --ink:#141A22; --ink-2:#4B5563; --muted:#5F6874; --low:#9AA0A8;
  --accent:#1c5cab; --accent-soft:#E3ECF7; --grid:#E1E0D9; --axis:#C3C2B7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* header */
.top{background:var(--surface); border-bottom:1px solid var(--rule); padding:18px 24px 16px; display:flex; gap:18px; align-items:flex-start}
.top .ttl{flex:1; min-width:0}
.logos{display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.logos img{display:block; max-height:52px; max-width:160px; object-fit:contain}
.lock-logos{justify-content:flex-start; margin-bottom:14px}
.lock-logos img{max-height:40px}
.top h1{margin:0 0 4px; font-size:22px; line-height:1.2; letter-spacing:-.01em; font-weight:650; color:var(--ink)}
.top .info{white-space:pre-wrap; color:var(--ink-2); font-size:13px; max-width:110ch}
.top .sample{color:var(--ink-2); font-size:13px; margin-top:4px; font-weight:600}

/* control bar */
.bar{position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--rule);
  padding:9px 24px; display:flex; gap:10px 20px; align-items:center; flex-wrap:wrap; box-shadow:0 1px 2px rgba(20,26,34,.05)}
.bar .grp{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.bar .lbl{font-size:12px; color:var(--muted); margin-right:2px}
.bar .spacer{flex:1}
.chip{border:1px solid var(--rule); background:var(--surface); border-radius:999px; padding:3px 11px; font-size:12.5px; color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.chip:hover{border-color:var(--accent)}
.sw{display:inline-flex; gap:7px; align-items:center; border:0; background:none; padding:3px 4px; font-size:12.5px; color:var(--ink-2)}
.sw i{width:28px; height:16px; border-radius:8px; background:var(--rule); position:relative; flex:0 0 auto; transition:background .12s}
.sw i::after{content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; transition:left .12s}
.sw[aria-pressed="true"] i{background:var(--accent)}
.sw[aria-pressed="true"] i::after{left:14px}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:5px; overflow:hidden}
.seg button{border:0; background:var(--surface); padding:4px 12px; font-size:12.5px; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}
.btn{border:1px solid var(--rule); background:var(--surface); border-radius:5px; padding:5px 12px; font-size:12.5px; font-weight:500}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.xl{background:#107C41; border-color:#107C41; color:#fff}
.btn.xl:hover{background:#0C6435; color:#fff}
.btn.sm{padding:2px 8px; font-size:11.5px; color:var(--muted)}
.bpick{position:relative}
.bbtn{border-color:var(--accent); color:var(--accent); font-weight:600}
.bpanel{position:absolute; top:calc(100% + 6px); left:0; z-index:50; width:340px; max-width:90vw; background:var(--surface);
  border:1px solid var(--rule); border-radius:6px; box-shadow:0 12px 30px rgba(20,26,34,.18); padding:8px}
.btools{display:flex; gap:6px; align-items:center; margin-bottom:6px}
.btools input{flex:1; min-width:0; padding:4px 7px; border:1px solid var(--rule); border-radius:4px; font-size:12.5px}
.blist{max-height:min(60vh, 420px); overflow-y:auto; overscroll-behavior:contain}
.bitem{display:flex; gap:8px; align-items:flex-start; padding:5px 4px; border-radius:4px; font-size:13px; cursor:pointer}
.bitem:hover{background:var(--surface-2)}
.bitem input{margin:2px 0 0; accent-color:var(--accent)}
.bitem span{flex:1; line-height:1.3}
.bitem small{color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}

/* layout */
.layout{display:grid; grid-template-columns:var(--side-w, 270px) minmax(0,1fr); align-items:start; position:relative}
.sresize{position:absolute; top:0; bottom:0; left:calc(var(--side-w, 270px) - 4px); width:8px; z-index:6; cursor:col-resize; touch-action:none}
.sresize::after{content:""; position:sticky; display:block; top:50vh; width:3px; height:34px; margin:0 auto; border-radius:2px; background:var(--rule)}
.sresize:hover::after,.sresize:focus-visible::after,body.resizing .sresize::after{background:var(--accent)}
.sresize:focus-visible{outline:none}
body.resizing{cursor:col-resize; user-select:none; -webkit-user-select:none}
.side{position:sticky; top:var(--bar-h, 50px); max-height:calc(100vh - var(--bar-h, 50px)); overflow-y:auto; overscroll-behavior:contain;
  padding:14px 10px 30px 18px; border-right:1px solid var(--rule)}
.side input[type=search]{width:100%; padding:5px 8px; border:1px solid var(--rule); border-radius:5px; background:var(--surface); font-size:12.5px; margin-bottom:8px}
.side .sec{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; margin:12px 4px 4px}
.navtools{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:0 0 6px}
.navcnt{font-size:11px; color:var(--muted); margin-left:auto}
.navitem{display:flex; gap:4px; align-items:flex-start}
.navitem input{width:auto; margin:5px 0 0 4px; padding:0; flex:0 0 auto; accent-color:var(--accent)}
.navitem a{flex:1; min-width:0}
.navitem.off a{color:var(--muted)}
.seg.mini button{padding:2px 9px; font-size:11.5px}
.side a{display:flex; gap:7px; padding:3px 6px; border-radius:4px; font-size:12.5px; line-height:1.3; color:var(--ink); text-decoration:none}
.side a:hover{background:var(--surface-2); color:var(--accent)}
.side a .n{color:var(--muted); font-size:11px; min-width:20px; font-variant-numeric:tabular-nums}
.main{padding:18px 24px 80px; min-width:0}
.main h2.sech{font-size:17px; margin:26px 0 12px; padding-bottom:6px; border-bottom:2px solid var(--accent); color:var(--ink)}
.main h2.sech:first-child{margin-top:4px}
.navbtn{display:none}
.morebar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:4px 0 20px}
.morebar .mini{font-size:12px; color:var(--muted)}
@media print{ .morebar{display:none} }

/* table cards */
.card,.ccard{background:var(--surface); border:1px solid var(--rule); border-radius:6px; margin:0 0 20px; scroll-margin-top:calc(var(--bar-h, 50px) + 12px)}
.card{overflow:hidden}
.card>header,.ccard>header{display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; padding:12px 14px 9px; border-bottom:1px solid var(--rule-soft)}
.card h3,.ccard h3{margin:0; font-size:15px; line-height:1.3; font-weight:600}
.card .vn,.ccard .vn{font-size:12px; color:var(--muted); margin-top:2px}
.card .ctl,.ccard .ctl{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.card select,.ccard select{font-size:12px; padding:2px 6px; border:1px solid var(--rule); border-radius:4px; background:var(--surface); color:var(--ink-2)}
.card select,.ccard select{max-width:260px; text-overflow:ellipsis}
.card.flash,.ccard.flash{outline:2px solid var(--accent); outline-offset:-1px}

/* tabs: all tables + custom reports */
.tabs{display:flex; gap:2px; padding:0 24px; background:var(--surface); border-bottom:1px solid var(--rule); overflow-x:auto}
.tabs[hidden]{display:none}
.tabs button{flex:0 0 auto; border:0; background:none; padding:9px 14px 7px; font-size:13px; color:var(--ink-2); border-bottom:2px solid transparent; white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis}
.tabs{scrollbar-width:thin}
.tabs button:hover{color:var(--accent)}
.tabs button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}
.tabs .tadd{color:var(--accent); font-weight:500}
.btn.mkrep{border-color:var(--accent); color:var(--accent); font-weight:600}
.btn.mkrep:hover{background:var(--accent-soft)}
.btn.pdf{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.word{background:#185ABD; border-color:#185ABD; color:#fff}
.btn.word:hover{background:#1148A0; border-color:#1148A0; color:#fff}
.wpanel{width:330px}
.wpanel .bitem span{display:flex; flex-direction:column; gap:1px}
.wpanel .bitem b{font-weight:600; color:var(--ink)}
.wpanel .wh{color:var(--muted); font-size:11.5px; line-height:1.3}
.btn.pdf:hover{filter:brightness(.92); color:#fff}
.btn.danger:hover,.btn.danger.armed{color:#B42318; border-color:#B42318}
label.btn{display:inline-block; cursor:pointer}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.cbar input.rname{font-size:14px; font-weight:600; padding:4px 9px; border:1px solid var(--rule); border-radius:5px; width:280px; max-width:100%; background:var(--surface)}
.cbar input.rname:focus{border-color:var(--accent); outline:none}

/* dataset tab */
.dview:not([hidden]){display:flex; flex-direction:column; height:calc(100vh - 46px); min-height:420px}
.dview .bar{position:static}
.dview .dfind{width:300px; max-width:100%; padding:5px 9px; border:1px solid var(--rule); border-radius:5px; font-size:13px; background:var(--surface)}
.dview .dstats{font-size:12.5px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.dview .btn:disabled{opacity:.45; cursor:default}
.dhint{padding:6px 24px 0; font-size:12px; color:var(--muted)}
.dgrid{flex:1 1 auto; min-height:0; display:flex; padding:8px 24px 16px}
.xpanel{left:auto; right:0; width:280px}
.xph{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; padding:2px 4px 4px}
.xpgo{display:flex; justify-content:flex-end; padding:6px 4px 2px}
/* ---- the author's tabs: locked for the reader ---- */
#copyRep{display:none}
#vCustom.locked #copyRep{display:inline-block}
#vCustom.locked .clay{grid-template-columns:minmax(0,1fr)}

/* the author's buttons in the builder */
.abtns{padding-top:8px; border-top:1px dashed var(--rule)}

/* ---- figure cards ---- */
.kgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:14px; margin:0 0 20px}
.kgrid .ccard{margin:0}
.ccard.xk{display:flex; flex-direction:column; padding:0 16px 14px; min-height:150px}

.ccard.xk .kl{font-size:13px; font-weight:600; color:var(--ink-2); line-height:1.35; margin:6px 0 4px}
.ccard.xk .kv{font-size:34px; font-weight:700; line-height:1.1; color:var(--accent); letter-spacing:-.01em; font-variant-numeric:tabular-nums}
.ccard.xk .kv.good{color:#2E7D32}
.ccard.xk .kv.bad{color:#C62828}
.ccard.xk .kbar{height:6px; border-radius:3px; background:var(--surface-2); margin:8px 0 2px; overflow:hidden}
.ccard.xk .kbar i{display:block; height:100%; background:var(--accent); border-radius:3px}
.ccard.xk .kn{font-size:11.5px; color:var(--muted); margin-top:4px}
.ccard.xk .ksplit{margin-top:10px; padding-top:8px; border-top:1px solid var(--rule-soft); font-size:12px}
.ccard.xk .kst{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:3px}
.ccard.xk .ksr{display:flex; justify-content:space-between; gap:8px; padding:1px 0}
.ccard.xk .ksr span{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ccard.xk .ksr b{font-variant-numeric:tabular-nums}
.ccard.xk .ksr.low b{color:var(--muted)}
.ccard.xk .knote{font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.4}
.ccard.xk .kmiss{font-size:12.5px; color:#B42318; margin-top:6px}
/* summary and sample */
.ccard .xtitle{padding:4px 14px 10px; font-size:15px}
.ccard.xs table.xsum td,.ccard.xs table.xsum th{text-align:center}
.ccard.xs table.xsum td.lbl,.ccard.xs table.xsum th.lbl{text-align:left}
.ccard.xs table.xsum td.low{color:var(--muted)}
.ccard.xs table.xsum small.xq{display:block; font-size:11px; color:var(--muted); font-weight:400; line-height:1.3}
.ccard.xp .xsmp{padding:0 14px 12px; font-size:13.5px; line-height:1.55}
.ccard.xp .xsl{font-weight:600}
.ccard.xp .xinfo{white-space:pre-wrap; color:var(--ink-2)}
.ccard.xp .cin{margin-top:2px}
/* progress against targets */
.ccard.xg>header{border-bottom:0; padding:6px 10px 0; min-height:6px}
.ccard.xg .gbars{padding:2px 14px 4px}
.ccard.xg.gcard{display:flex; flex-direction:column; padding:0 16px 12px; margin:0}
.ccard.xg.gcard .gbars{padding:0}
.ccard.xg.gcard .kl{font-size:13px; font-weight:600; color:var(--ink-2); margin:6px 0 6px}
#vCustom.locked .ccard.xg.gcard>header{display:none}
.gbar{margin:0 0 10px}
.gtop{display:flex; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:4px}
.gbar .glab{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.gbar .gval{color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap}
.gbar.tot .glab,.gbar.tot .gval{font-weight:650; color:var(--ink)}
.gbar.undef .glab,.gbar.undef .gval{color:var(--muted)}
.gtrack{height:10px; border-radius:5px; background:var(--surface-2); overflow:hidden}
.gtrack i{display:block; height:100%; background:var(--accent); border-radius:5px}
.gbar.done .gtrack i{background:#2E7D32}
.gbar.done .gval{color:#2E7D32; font-weight:600}
.ccard.xg .gasof{padding:0 14px 12px; margin:0; font-size:11.5px; color:var(--muted)}
.ccard.xg.gcard .gasof{padding:0}
.ccard.xg.gcard .kv{font-size:34px; font-weight:700; line-height:1.1; color:var(--accent); font-variant-numeric:tabular-nums}
.ccard.xg.gcard .kv.good{color:#2E7D32}
.ccard.xg.gcard .gsub{font-size:12.5px; color:var(--ink-2); margin:2px 0 8px}
.ccard.xg.gcard .gtrack{margin-bottom:8px}
.gtrack.done i{background:#2E7D32}
.ccard.xg.gcard .gtop{flex-wrap:wrap; gap:0 8px}
.gtgt{display:grid; grid-template-columns:minmax(0,1fr) auto 110px; gap:6px 12px; align-items:center; margin:0 0 6px}
.gtgt .gth{font-size:11.5px; color:var(--muted)}
.gtgt .gcl{font-size:13px}
.gtgt .gcn{font-size:13px; color:var(--ink-2); text-align:right; font-variant-numeric:tabular-nums}
.gtgt input{width:100%; padding:5px 7px; border:1px solid var(--rule); border-radius:5px; font:inherit; font-size:13px}
.rthr input[type=number]:disabled{opacity:.5}
/* ---- the author's editors ---- */
.rmodal-ov{position:fixed; inset:0; z-index:200; background:rgba(15,20,28,.42); display:flex; align-items:flex-start; justify-content:center; padding:5vh 14px; overflow-y:auto}
.rmodal{background:var(--surface); border-radius:8px; box-shadow:0 18px 50px rgba(0,0,0,.3); width:min(620px, 100%); display:flex; flex-direction:column; max-height:90vh}
.rmodal>header{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--rule)}
.rmodal>header h2{flex:1; margin:0; font-size:16px}
.rmbody{padding:14px 16px; overflow-y:auto}
.rmodal>footer{display:flex; justify-content:flex-end; gap:8px; padding:10px 16px; border-top:1px solid var(--rule)}
.rf{display:block; margin:0 0 12px}
.rfl{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
.rfh{display:block; font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.4}
.rf select,.rf input[type=text],.rf input[type=number]{width:100%; padding:6px 8px; border:1px solid var(--rule); border-radius:5px; background:var(--surface); font:inherit; font-size:13px; color:var(--ink)}
.rf select{max-width:none}
.rseg{display:inline-flex}
.rseg button:disabled{opacity:.4; cursor:not-allowed}
.rrows{max-height:220px; overflow-y:auto; border:1px solid var(--rule-soft); border-radius:5px; padding:4px 8px}
.rcheck{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:3px 0; cursor:pointer}
.rcheck input{margin:3px 0 0}
.rcheck .net{font-weight:600}
.rthr{display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center}
.rthr input{width:90px !important}
.rthr .good{color:#2E7D32; font-size:12.5px}
.rthr .bad{color:#C62828; font-size:12.5px}
.rpv{display:flex; gap:10px; align-items:baseline; padding:10px 12px; background:var(--surface-2); border-radius:6px; font-size:13px}
.rpv b{font-size:22px; color:var(--accent)}
.rpvl,.rpvn{color:var(--muted)}
.rmlist{border:1px solid var(--rule-soft); border-radius:5px; padding:4px 8px; margin-bottom:6px}
.rmrow{display:flex; gap:8px; align-items:center; padding:4px 0; border-bottom:1px solid var(--rule-soft)}
.rmrow:last-child{border-bottom:0}
.rmn{color:var(--muted); font-size:12px; min-width:18px}
.rmt{flex:1; min-width:0}
.rmt b{display:block; font-weight:600; font-size:13px}
.rmt small{display:block; color:var(--muted); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}

@media (max-width:900px){ .dgrid{padding:8px 10px 12px} .dhint{padding:6px 14px 0} }

/* custom report: add list on the left */
.sidebtns{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px}
.cside{padding-top:0}
.cstick{position:sticky; top:0; z-index:3; background:var(--paper); padding:14px 0 4px; margin-bottom:6px; border-bottom:1px solid var(--rule-soft)}
.cstick .sec{margin-top:0}
.cstick input[type=search]{margin-bottom:6px}
.btn.undo:disabled{opacity:.4; cursor:default}
.btn.undo:disabled:hover{border-color:var(--rule); color:inherit}
.addrow{display:flex; gap:4px; align-items:flex-start; padding:4px 4px; border-radius:4px; font-size:12.5px}
.addrow:hover{background:var(--surface-2)}
.addrow .tt{flex:1; min-width:0; line-height:1.3; padding-top:1px}
.addrow .tt .n{color:var(--muted); font-size:11px; margin-right:5px; font-variant-numeric:tabular-nums}
.addrow button{flex:0 0 auto; border:1px solid var(--rule); background:var(--surface); border-radius:4px; font-size:11px; padding:1px 6px; color:var(--accent); white-space:nowrap}
.addrow button:hover{border-color:var(--accent); background:var(--accent-soft)}

/* custom report: elements */
.ccard>header{align-items:center}
.ectl{display:flex; gap:2px; align-items:center; flex:0 0 auto}
.ehandle{cursor:grab; color:var(--low); padding:0 4px 0 0; user-select:none; font-size:14px}
.ib{border:1px solid transparent; background:none; color:var(--muted); border-radius:4px; padding:1px 6px; font-size:13px; line-height:1.3}
.ib:hover:not(:disabled){border-color:var(--rule); color:var(--accent)}
.ib:disabled{opacity:.3; cursor:default}
.ib.rm:hover{color:#B42318}
.etail{display:flex; gap:2px; align-items:center}
.ettl{flex:1; min-width:0}
.ekind{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600}
.ccard .spacer{flex:1}
.eset{display:flex; gap:6px 14px; align-items:center; flex-wrap:wrap; padding:7px 14px; border-bottom:1px solid var(--rule-soft); background:var(--surface-2)}
.eset .sw{font-size:12px}
.eset .bbtn{font-size:12px; padding:3px 10px; background:var(--surface)}
.ccard .scroll{border-radius:0 0 6px 6px}
.ccard.hd,.ccard.cm{background:transparent; border:1px dashed var(--rule)}
.ccard.hd>header,.ccard.cm>header{border-bottom:0; padding:6px 10px 2px}
.ccard .hin{display:block; width:calc(100% - 20px); margin:0 10px 10px; font:inherit; font-size:18px; font-weight:650; color:var(--ink);
  border:0; border-bottom:2px solid var(--accent); background:transparent; padding:4px 2px}
.ccard .hin:focus{outline:none; background:var(--surface)}
.ccard .cin{display:block; width:calc(100% - 20px); margin:0 10px 10px; font:inherit; font-size:13.5px; line-height:1.5; color:var(--ink);
  border:1px solid var(--rule); border-radius:5px; padding:8px 10px; resize:vertical; min-height:70px; background:var(--surface)}
.ccard .cin:focus{outline:none; border-color:var(--accent)}
.ccard.dragging{opacity:.45}
.ccard.dropmark{box-shadow:0 -3px 0 0 var(--accent)}
.ccard.miss{border-style:dashed}
.emptyc{border:1px dashed var(--rule); border-radius:6px; padding:28px 22px; color:var(--ink-2); background:var(--surface); max-width:70ch; line-height:1.5}
.ponly{display:none}
.scroll{overflow-x:auto; position:relative}
table.ct{--lblw:290px; --colw:82px; --measw:58px; border-collapse:collapse; width:100%; table-layout:fixed; font-size:12.5px; font-variant-numeric:tabular-nums}
table.ct col.c-lbl{width:var(--lblw)}
table.ct col.c-meas{width:var(--measw)}
table.ct th,table.ct td{overflow-wrap:anywhere}
table.ct th,table.ct td{border:1px solid var(--rule-soft); padding:4px 7px; text-align:center; vertical-align:middle}
table.ct th{background:var(--surface-2); font-weight:600; font-size:12px; line-height:1.25}
table.ct th.lbl,table.ct td.lbl{text-align:left; font-weight:400; min-width:190px; max-width:340px; background:var(--surface)}
table.ct thead th.lbl{background:var(--surface-2)}
table.ct tr.base th,table.ct tr.base td{background:var(--surface-2); font-weight:600; font-size:12px}
table.ct td.meas{color:var(--muted); font-size:11.5px}
table.ct sup{font-size:9.5px; margin-left:2px; letter-spacing:.3px}
table.ct td.low{color:var(--low)}
table.ct th.gsep,table.ct td.gsep{border-left:2px solid var(--muted)}
table.ct th.tot,table.ct td.tot,table.ct tr.base td.tot{background:var(--accent-soft)}
table.ct td.tot{font-weight:600}
table.ct tr.stat td{border-top:1.5px solid var(--rule)}
table.ct tbody tr:hover td{background:#EEF3F8}
table.ct tbody tr:hover td.tot{background:#D9E6F2}
.ct .stickycol{position:sticky; z-index:2}
.ct thead .stickycol{z-index:4}
.ct .stickyedge{box-shadow:2px 0 0 0 var(--muted)}
.notes{padding:8px 14px 12px; font-size:11.5px; color:var(--muted)}
.notes div{margin-bottom:3px}
.tcomment{margin:4px 14px 14px; padding:9px 12px 10px; background:var(--surface-2); border-left:3px solid var(--accent); border-radius:0 4px 4px 0}
@media print{ .tcomment{break-inside:avoid; -webkit-print-color-adjust:exact; print-color-adjust:exact} }
.tcomment .tch{font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); margin:0 0 3px}
.tcomment .tct{font-size:13.5px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere}

/* charts */
.chartbox{padding:10px 14px 4px}
.chartbox svg{display:block; width:100%; height:auto; max-width:860px}
.chartbox svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.nochart{padding:20px 14px; color:var(--muted); font-size:13px}

/* lock screen */
.lock{max-width:380px; margin:12vh auto; background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:26px 26px 22px}
.lock h1{font-size:18px; margin:0 0 6px}
.lock p{margin:0 0 14px; color:var(--ink-2); font-size:13px}
.lock input{width:100%; padding:7px 9px; border:1px solid var(--rule); border-radius:5px; margin-bottom:10px}
.lock .err{color:#B42318; font-size:12.5px; min-height:18px}
.lock button{background:var(--accent); color:#fff; border:0; border-radius:5px; padding:7px 16px; font-weight:500}

.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:8px 14px; border-radius:5px; font-size:13px; z-index:80}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{display:none; position:static; max-height:none; border-right:0; border-bottom:1px solid var(--rule); padding:12px 16px}
  .side.open{display:block}
  .sresize{display:none}
  .navbtn{display:inline-block}
  .cstick{position:static}
  .top,.bar{padding-left:14px; padding-right:14px}
  .tabs{padding:0 6px}
  .tabs button{padding:9px 10px 7px; max-width:200px}
  .main{padding:14px 12px 60px}
  table.ct th.lbl,table.ct td.lbl{min-width:140px}
